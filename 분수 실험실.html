<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분수 실험실 · 클라시트</title><style>
:root{font-family:system-ui,"Apple SD Gothic Neo",sans-serif;color:#23344c;background:#f3f7fc}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:980px;margin:auto}h1{margin:8px 0}p{line-height:1.6}.panel{background:white;border:1px solid #dce5ef;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #152c4910}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;min-height:48px;padding:9px 15px;border-radius:12px;border:1px solid #b8c9d9;background:white;color:#23344c;cursor:pointer}button.primary,.active{background:#177c72;color:white;border-color:#177c72}button:focus-visible,select:focus-visible{outline:3px solid #f2b84b}svg{width:100%;max-width:470px;display:block;margin:12px auto;touch-action:manipulation}svg [role=button]{cursor:pointer}#fraction{font-size:clamp(28px,5vw,44px);font-weight:800;color:#087b70}#message{min-height:48px;font-weight:700}#shape{min-height:240px}.muted{color:#66768b}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.fraction-row{font-size:23px;font-weight:750}a{color:#116c7d}@media(max-width:600px){body{padding:10px}.panel{padding:14px}button{flex:1}}
</style></head><body><main><a href="index.html">← 교사 도구로 돌아가기</a><h1>분수 실험실</h1><p>도형을 직접 눌러 색칠하고, 같은 넓이를 여러 분수로 나타내 보세요.</p><section class="panel"><div class="controls"><button id="free" class="primary">자유 실험실</button><button id="challenge">도전 모드</button><label>도형 <select id="kind"><option value="rect">사각형</option><option value="circle">원</option></select></label><label>분할 <select id="denom"></select></label></div><div id="shape" aria-label="색칠할 분수 모형"></div><div class="controls"><button id="clear">색칠 지우기</button><button id="all">전체 색칠</button><button id="undo">한 단계 되돌리기</button><button id="refine">조각을 두 배로 나누기</button></div><p>현재 색칠한 분수 <span id="fraction">1/4</span> <span id="percent" class="muted">25%</span></p><p id="message" role="status" aria-live="polite"></p></section><div class="split"><section class="panel"><h2>분수 덧셈 실험</h2><p class="muted">같은 크기의 전체를 기준으로 계산해요.</p><div class="controls"><label>첫째 분수 <select id="a"></select></label><label>둘째 분수 <select id="b"></select></label></div><p id="addition" class="fraction-row"></p><div id="additionShape"></div></section><section class="panel"><h2>분수 도전</h2><p id="goal">도전 모드를 선택해 보세요.</p><div class="controls"><button id="check" class="primary">정답 확인</button><button id="next">다음 문제</button></div><p id="score" aria-live="polite">성공 0문제</p></section></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const gcd=(a,b)=>b?gcd(b,a%b):a;const reduce=(n,d)=>{const g=gcd(n,d);return [n/g,d/g]};const fraction=(n,d)=>{const [a,b]=reduce(n,d);return a+'/'+b};const state={d:4,selected:new Set([0]),kind:'rect',mode:'free',history:[],goal:[1,2],score:0,step:0};const goals=[[1,2],[2,3],[3,4],[1,4],[3,6],[5,8],[2,4],[4,6]];function save(){state.history.push({d:state.d,selected:[...state.selected],kind:state.kind});if(state.history.length>40)state.history.shift()}function msg(s){$('message').textContent=s}function sync(){ $('denom').value=state.d;$('kind').value=state.kind;$('fraction').textContent=fraction(state.selected.size,state.d);$('percent').textContent=Math.round(100*state.selected.size/state.d)+'%';draw();}function draw(){const d=state.d,selected=state.selected;let paths='';for(let i=0;i<d;i++){let path;if(state.kind==='rect'){const x=10+i*440/d;path='<rect x="'+x+'" y="20" width="'+(440/d)+'" height="220" />'}else{const a=-Math.PI/2+i*2*Math.PI/d,b=a+2*Math.PI/d;const x=t=>230+105*Math.cos(t),y=t=>130+105*Math.sin(t);path='<path d="M230 130 L'+x(a)+' '+y(a)+' A105 105 0 '+(b-a>Math.PI?1:0)+' 1 '+x(b)+' '+y(b)+' Z" />'}paths+='<g role="button" tabindex="0" aria-label="'+(i+1)+'번 조각 '+(selected.has(i)?'색칠됨':'색칠 안 됨')+'" data-i="'+i+'" fill="'+(selected.has(i)?'#35b7a5':'#eef4fa')+'" stroke="#2c5366" stroke-width="1.8">'+path+'</g>'} $('shape').innerHTML='<svg viewBox="0 0 460 260" role="group" aria-label="'+d+'개 중 '+selected.size+'개 색칠">'+paths+'</svg>';for(const el of $('shape').querySelectorAll('[data-i]')){const toggle=()=>{save();const i=Number(el.dataset.i);state.selected.has(i)?state.selected.delete(i):state.selected.add(i);sync();msg('색칠한 넓이를 확인해 보세요.')};el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})}}function changeDenom(next){if(next===state.d)return;const old=state.d,sel=state.selected;const newSel=new Set();for(let j=0;j<next;j++){const left=j/next,right=(j+1)/next;let covered=0;for(const i of sel){covered+=Math.max(0,Math.min(right,(i+1)/old)-Math.max(left,i/old))}if(covered>1e-9&&Math.abs(covered-(right-left))>1e-9){msg('색칠한 영역을 정확히 유지할 수 없는 분할이에요. '+old+'조각 상태를 유지합니다.');return}if(covered>1e-9)newSel.add(j)}save();state.d=next;state.selected=newSel;sync();msg('전체 넓이와 색칠한 영역은 그대로예요.')}for(let i=1;i<=24;i++)$('denom').add(new Option(i+'조각',i));for(const id of ['a','b']){for(let d=2;d<=8;d++)for(let n=1;n<d;n++)$(id).add(new Option(n+'/'+d,n+'/'+d));$(id).value=id==='a'?'1/4':'2/4'}function add(){const [a,b]=$('a').value.split('/').map(Number),[c,d]=$('b').value.split('/').map(Number);const common=b*d/gcd(b,d),n=a*(common/b)+c*(common/d);$('addition').textContent=a+'/'+b+' + '+c+'/'+d+' = '+n+'/'+common+' = '+fraction(n,common);let blocks='';for(let i=0;i<common;i++)blocks+='<span style="display:inline-block;width:'+Math.max(10,100/common)+'%;height:42px;border:1px solid #426777;background:'+(i<n?'#35b7a5':'#eef4fa')+'"></span>';$('additionShape').innerHTML='<div aria-label="합 '+n+'/'+common+'" style="display:flex;flex-wrap:wrap">'+blocks+'</div><p class="muted">공통 분모 '+common+'으로 나누어 합친 결과입니다.</p>'}function next(){state.step=(state.step+1)%goals.length;state.goal=goals[state.step];$('goal').textContent='목표: '+state.goal.join('/')+'만큼 색칠해 보세요.';msg('목표 분수를 만들어 보세요.')}function mode(m){state.mode=m;$('free').classList.toggle('primary',m==='free');$('challenge').classList.toggle('primary',m==='challenge');$('goal').textContent=m==='free'?'자유 실험에는 정답과 오답이 없어요.':'목표: '+state.goal.join('/')+'만큼 색칠해 보세요.';msg(m==='free'?'마음껏 실험해 보세요.':'도형을 색칠한 뒤 정답 확인을 누르세요.')} $('denom').onchange=e=>changeDenom(Number(e.target.value));$('kind').onchange=e=>{save();state.kind=e.target.value;sync()};$('clear').onclick=()=>{save();state.selected.clear();sync()};$('all').onclick=()=>{save();state.selected=new Set(Array.from({length:state.d},(_,i)=>i));sync()};$('undo').onclick=()=>{const h=state.history.pop();if(!h){msg('되돌릴 단계가 없어요.');return}state.d=h.d;state.selected=new Set(h.selected);state.kind=h.kind;sync();msg('이전 단계로 돌아왔어요.')};$('refine').onclick=()=>{if(state.d*2>24){msg('최대 24조각까지 나눌 수 있어요.');return}changeDenom(state.d*2)};$('free').onclick=()=>mode('free');$('challenge').onclick=()=>mode('challenge');$('next').onclick=next;$('check').onclick=()=>{if(state.mode!=='challenge'){msg('도전 모드에서 정답을 확인할 수 있어요.');return}if(state.selected.size*state.goal[1]===state.goal[0]*state.d){state.score++;$('score').textContent='성공 '+state.score+'문제';msg('정답이에요! 같은 크기의 분수를 만들었어요.');next()}else msg('조각의 수가 아니라 전체에서 색칠한 넓이를 비교해 보세요.')};$('a').onchange=add;$('b').onchange=add;sync();add();mode('free')})();
</script></body></html>
