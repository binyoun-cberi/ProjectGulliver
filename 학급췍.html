<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1초 뚝딱! 제출·준비물 확인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc; /* 아주 연한 배경색 */
            user-select: none; /* 드래그 방지 */
        }
        
        /* 자리 클릭 시 부드러운 애니메이션 효과 */
        .desk {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .desk:active {
            transform: scale(0.95);
        }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 팝업 모달 애니메이션 */
        .modal-enter {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

    .check-pending{margin:-12px 0 20px;padding:14px 17px;border:1px solid #d9e9e1;border-radius:15px;background:#f2faf5;line-height:1.55}
    .check-pending strong{font-size:14px;color:#205e50}
    .check-pending p{font-size:13px;color:#475f59;margin:6px 0 0;overflow-wrap:anywhere}
    .check-undo{border:1px solid #b5d8c5;color:#125e4d;border-radius:12px;background:#e9f7ef;padding:10px 14px;font-size:14px;font-weight:800;white-space:nowrap;min-height:44px}
    .check-undo:disabled{opacity:.4;cursor:not-allowed}
    #desk-grid .desk{font:inherit;min-height:112px;line-height:1.4;touch-action:manipulation;text-align:center}
    #desk-grid .desk:focus-visible,.check-undo:focus-visible{outline:3px solid #0c9479;outline-offset:3px}
    @media(max-width:520px){#desk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#desk-grid .desk{padding:12px 7px;min-height:88px}.check-pending{margin:-8px 0 14px}header .gt-v62-check-edit{flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){#desk-grid .desk{transition:none!important}}
    </style>
    <script src="gulliver-shared.js?v=20261020-ui"></script>
<link rel="stylesheet" href="gulliver-teacher-ui.css?v=20261019-dual1">
<script defer src="gulliver-teacher-components.js?v=20261018-v60"></script>
<script defer src="gulliver-teacher-shell.js?v=20261020-ui"></script>
<link rel="stylesheet" href="gulliver-teacher-v62.css?v=20261019-v62">
<script src="gulliver-teacher-display.js?v=20261019-v62"></script>
<script src="gulliver-teacher-v62.js?v=20261020-ui"></script>
<link rel="stylesheet" href="gulliver-design.css?v=20261020-1">
<script src="gulliver-app-shell.js?v=20261020-1"></script>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center py-10 px-4 sm:px-8">

    <div class="w-full max-w-6xl">
        
        <!-- 헤더 영역 -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">✅ 제출·준비물 확인</h1>
                <p class="text-slate-500 font-medium" id="progress-text">현재 0명 제출 완료 (0%)</p>
            </div>
            
            <div class="flex gap-2 gt-v62-check-edit">
                <button id="undoChecklistBtn" type="button" disabled aria-label="최근 체크 되돌리기" class="check-undo">↶ 체크 취소</button>
                <button onclick="resetCurrentTheme()" class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-colors shadow-sm font-medium text-sm flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    전체 초기화
                </button>
                <button id="load-classroom-btn" type="button" class="px-4 py-2 bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-xl hover:bg-indigo-100 transition-colors shadow-sm font-semibold text-sm flex items-center gap-2">👥 우리 반</button>
                <button onclick="openSettings()" class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-colors shadow-sm font-medium text-sm flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    인원 설정
                </button>
            </div>
        </header>

        <!-- 테마 탭 (체크리스트 종류) -->
        <div class="flex items-center gap-2 mb-8 overflow-x-auto pb-2" id="theme-tabs">
            <!-- 탭이 동적으로 추가됩니다 -->
        </div>

        <!-- 프로그레스 바 -->
        <div class="w-full bg-slate-200 rounded-full h-2.5 mb-8">
            <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>

        <section class="check-pending" aria-label="교사용 미확인 학생 목록">
          <strong id="pendingTitle">아직 체크하지 않은 학생</strong>
          <p id="pendingNames">학생 명단을 불러오면 이곳에서 확인할 수 있어요.</p>
        </section>

        <!-- 자리 배치도 (체크리스트) -->
        <div class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-4 sm:gap-6" id="desk-grid">
            <!-- 자리 블록이 동적으로 추가됩니다 -->
        </div>

    </div>

    <!-- 우클릭 커스텀 메뉴 (테마 삭제용) -->
    <div id="context-menu" class="hidden fixed bg-white shadow-xl rounded-xl py-2 w-32 border border-slate-100 z-50">
        <button id="btn-delete-theme" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 hover:font-medium transition-colors">
            테마 삭제
        </button>
    </div>

    <!-- 공통 모달 UI -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden modal-enter p-6">
            <h3 id="modal-title" class="text-xl font-bold text-slate-900 mb-2">제목</h3>
            <p id="modal-desc" class="text-sm text-slate-500 mb-5">설명</p>
            
            <input type="text" id="modal-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-shadow mb-6 hidden" autocomplete="off">
            
            <div class="flex gap-3 justify-end">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium transition-colors">취소</button>
                <button id="modal-confirm" class="px-5 py-2.5 rounded-xl text-white bg-emerald-500 hover:bg-emerald-600 font-medium transition-colors shadow-sm shadow-emerald-500/30">확인</button>
            </div>
        </div>
    </div>

    <script>
        // 기본 상태 데이터
        const DEFAULT_STUDENT_COUNT = 25;
        const DEFAULT_THEMES = ['독서록', '수학 익힘책', '우유 급식', '안내장'];

        let lastCheckChange = null;
        let state = {
            studentCount: DEFAULT_STUDENT_COUNT,
            themes: [...DEFAULT_THEMES],
            currentTheme: '독서록',
            data: {}, // 구조: { '독서록': { 1: true, 2: false, ... }, '수학 익힘책': { ... } }
            studentNames: []
        };

        // 데이터 초기화 및 보정
        function initData() {
            state.themes.forEach(theme => {
                if (!state.data[theme]) state.data[theme] = {};
                // 학생 수가 늘어났을 경우를 대비해 초기화
                for (let i = 1; i <= state.studentCount; i++) {
                    if (state.data[theme][i] === undefined) {
                        state.data[theme][i] = false;
                    }
                }
            });
        }

        // 로컬 스토리지에서 데이터 불러오기
        function loadState() {
            const saved = localStorage.getItem('classChecklistState');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.studentCount = parsed.studentCount || DEFAULT_STUDENT_COUNT;
                    state.themes = parsed.themes || [...DEFAULT_THEMES];
                    state.currentTheme = parsed.currentTheme || state.themes[0];
                    state.data = parsed.data || {};
                    state.studentNames = Array.isArray(parsed.studentNames) ? parsed.studentNames : [];
                } catch (e) {
                    console.error("데이터 불러오기 실패", e);
                }
            }
            initData();
        }

        // 로컬 스토리지에 데이터 저장
        function saveState() {
            localStorage.setItem('classChecklistState', JSON.stringify(state));
            updateProgress();
        }

        // 테마 탭 렌더링
        function renderTabs() {
            const container = document.getElementById('theme-tabs');
            container.innerHTML = '';

            state.themes.forEach(theme => {
                const isActive = state.currentTheme === theme;
                const btn = document.createElement('button');
                
                btn.setAttribute("aria-pressed",String(isActive));
                // 미니멀하고 세련된 탭 스타일링
                btn.className = `px-5 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap transition-all duration-200 ${
                    isActive 
                    ? 'bg-slate-800 text-white shadow-md' 
                    : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 hover:text-slate-800'
                }`;
                btn.textContent = theme;
                
                // 좌클릭: 테마 변경
                btn.onclick = () => {
                    state.currentTheme = theme;
                    saveState();
                    renderTabs();
                    renderGrid();
                };

                // 우클릭: 커스텀 메뉴 열기 (테마 삭제)
                btn.oncontextmenu = (e) => {
                    e.preventDefault();
                    if(state.themes.length <= 1) {
                        showModal('알림', '최소 1개 이상의 테마가 필요합니다.', null, () => closeModal(), false);
                        return;
                    }
                    showContextMenu(e.pageX, e.pageY, theme);
                };

                container.appendChild(btn);
            });

            // 테마 추가 버튼
            const addBtn = document.createElement('button');
            addBtn.className = 'px-4 py-2.5 rounded-xl font-bold text-sm text-slate-400 bg-slate-100 hover:bg-slate-200 hover:text-slate-700 transition-colors flex items-center justify-center border border-dashed border-slate-300';
            addBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
            addBtn.onclick = () => {
                showModal('새 테마 추가', '새로 만들 체크리스트의 이름을 입력하세요.', '예: 미술 준비물', (val) => {
                    if (val && !state.themes.includes(val)) {
                        state.themes.push(val);
                        state.currentTheme = val;
                        initData();
                        saveState();
                        renderTabs();
                        renderGrid();
                    }
                });
            };
            container.appendChild(addBtn);

            if (state.themes.length > 1) {
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'px-4 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap transition-colors text-red-500 bg-red-50 hover:bg-red-100 border border-red-100';
                deleteBtn.textContent = '🗑️ 현재 테마';
                deleteBtn.onclick = () => {
                    const target = state.currentTheme;
                    showModal('테마 삭제', `'${target}' 테마를 삭제하시겠습니까? (기록도 함께 삭제됩니다)`, null, () => {
                        state.themes = state.themes.filter(t => t !== target);
                        delete state.data[target];
                        state.currentTheme = state.themes[0];
                        saveState();
                        renderTabs();
                        renderGrid();
                    }, false);
                };
                container.appendChild(deleteBtn);
            }
        }


  function updateDeskAppearance(desk,index){
    const isChecked=Boolean(state.data[state.currentTheme]?.[index]);
    desk.className=`desk cursor-pointer flex flex-col items-center justify-center p-6 rounded-2xl border-2 transition-all duration-200 relative overflow-hidden group ${isChecked?'bg-emerald-500 border-emerald-500 text-white shadow-lg shadow-emerald-500/30':'bg-white border-slate-200 text-slate-600 hover:border-emerald-200 hover:bg-emerald-50'}`;
    desk.setAttribute('aria-pressed',String(isChecked));
    const name=state.studentNames[index-1]||String(index);
    desk.setAttribute('aria-label',name+' · '+(isChecked?'제출 완료':'미제출')+' · 누르면 상태 변경');
    const label=desk.querySelector('.desk-status');
    if(label){label.textContent=isChecked?'제출 완료':'미제출';label.className='desk-status text-sm font-semibold tracking-wide '+(isChecked?'text-emerald-100':'text-slate-500');}
    const title=desk.querySelector('.desk-name');
    if(title)title.className='desk-name font-black mb-1 text-center break-keep '+(state.studentNames[index-1]?'text-lg':'text-3xl')+' '+(isChecked?'text-white':'text-slate-900');
  }
  function updateUndo(){
    const button=document.getElementById('undoChecklistBtn');
    button.disabled=!lastCheckChange||lastCheckChange.theme!==state.currentTheme;
    button.title=button.disabled?'되돌릴 체크가 없어요.':'직전 체크 1개를 되돌립니다.';
  }
  function toggleDesk(index){
    const current=Boolean(state.data[state.currentTheme][index]);
    lastCheckChange={theme:state.currentTheme,index,previous:current};
    state.data[state.currentTheme][index]=!current;
    saveState();updateUndo();
    const button=document.querySelector(`#desk-grid .desk[data-index="${index}"]`);
    if(button)updateDeskAppearance(button,index);
  }
  function undoLastCheck(){
    if(!lastCheckChange||lastCheckChange.theme!==state.currentTheme)return;
    const {index,previous}=lastCheckChange;
    state.data[state.currentTheme][index]=previous;
    lastCheckChange=null;saveState();updateUndo();
    const button=document.querySelector(`#desk-grid .desk[data-index="${index}"]`);
    if(button){updateDeskAppearance(button,index);button.focus();}
  }
  document.getElementById('undoChecklistBtn').addEventListener('click',undoLastCheck);
  function renderGrid(){
    const container=document.getElementById('desk-grid');
    container.replaceChildren();
    for(let i=1;i<=state.studentCount;i++){
      const desk=document.createElement('button');
      desk.type='button';desk.dataset.index=String(i);
      const num=document.createElement('span');num.className='desk-name';
      num.textContent=state.studentNames[i-1]||String(i);
      const status=document.createElement('span');status.className='desk-status';
      desk.append(num,status);
      desk.onclick=()=>toggleDesk(i);
      updateDeskAppearance(desk,i);
      container.append(desk);
    }
    updateProgress();updateUndo();
  }

        // 진행률 업데이트
        function updateProgress() {
            const currentData = state.data[state.currentTheme];
            let checkedCount = 0;
            
            for(let i=1; i<=state.studentCount; i++){
                if(currentData[i]) checkedCount++;
            }

            const percentage = state.studentCount > 0 ? Math.round((checkedCount / state.studentCount) * 100) : 0;
            
            document.getElementById('progress-text').textContent = `현재 ${checkedCount}명 제출 완료 (${percentage}%)`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            const pending=[];
            for(let i=1;i<=state.studentCount;i++)if(!currentData[i])pending.push(state.studentNames[i-1]||String(i)+'번');
            document.getElementById('pendingTitle').textContent=`아직 체크하지 않은 학생 · ${pending.length}명`;
            document.getElementById('pendingNames').textContent=pending.length?pending.join(' · '):'모두 확인했어요.';

        }

        // 현재 테마 초기화
        function resetCurrentTheme() {
            showModal('전체 초기화', `'${state.currentTheme}'의 제출 상태를 모두 미제출로 되돌리시겠습니까?`, null, () => {
                for (let i = 1; i <= state.studentCount; i++) {
                    state.data[state.currentTheme][i] = false;
                }
                saveState();
                renderGrid();
            }, false); // 입력창 없는 모달
        }

        // 인원 설정
        function openSettings() {
            showModal('학생 수 설정', '우리 반의 총 학생 수를 입력하세요.', state.studentCount, (val) => {
                const count = parseInt(val);
                if (!isNaN(count) && count > 0 && count <= 100) {
                    state.studentCount = count;
                    state.studentNames = [];
                    initData();
                    saveState();
                    renderGrid();
                } else {
                    alert('1부터 100 사이의 올바른 숫자를 입력해주세요.');
                }
            });
        }

        /* --- 우클릭 커스텀 메뉴 로직 --- */
        const contextMenu = document.getElementById('context-menu');
        let themeToDelete = null;

        function showContextMenu(x, y, theme) {
            themeToDelete = theme;
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.classList.remove('hidden');
        }

        function hideContextMenu() {
            contextMenu.classList.add('hidden');
            themeToDelete = null;
        }

        // 바탕 클릭 시 컨텍스트 메뉴 닫기
        document.addEventListener('click', hideContextMenu);

        document.getElementById('btn-delete-theme').onclick = () => {
            if (themeToDelete) {
                showModal('테마 삭제', `'${themeToDelete}' 테마를 삭제하시겠습니까? (기록도 함께 삭제됩니다)`, null, () => {
                    state.themes = state.themes.filter(t => t !== themeToDelete);
                    delete state.data[themeToDelete];
                    
                    if (state.currentTheme === themeToDelete) {
                        state.currentTheme = state.themes[0];
                    }
                    saveState();
                    renderTabs();
                    renderGrid();
                }, false);
            }
        };

        /* --- 커스텀 모달 로직 (alert/prompt 대체) --- */
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalInput = document.getElementById('modal-input');
        const modalConfirm = document.getElementById('modal-confirm');
        let currentModalCallback = null;

        function showModal(title, desc, placeholderText, callback, isPrompt = true) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            
            if (isPrompt) {
                modalInput.classList.remove('hidden');
                modalInput.value = '';
                if(placeholderText) modalInput.placeholder = placeholderText;
                setTimeout(() => modalInput.focus(), 100);
            } else {
                modalInput.classList.add('hidden');
            }

            currentModalCallback = callback;
            modalOverlay.classList.remove('hidden');
        }

        function closeModal() {
            modalOverlay.classList.add('hidden');
            currentModalCallback = null;
            modalInput.value = '';
        }

        modalConfirm.onclick = () => {
            if (currentModalCallback) {
                currentModalCallback(modalInput.classList.contains('hidden') ? null : modalInput.value.trim());
            }
            closeModal();
        };

        // 엔터키로 모달 확인
        modalInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                modalConfirm.click();
            }
        });

        Gulliver.mountShell({title:'제출·준비물 확인',icon:'✅'});
        document.getElementById('load-classroom-btn').addEventListener('click', () => {
            const room = Gulliver.getClassroom();
            if (!room.students.length) {
                Gulliver.toast('먼저 우리 반에서 학생 명단을 저장해 주세요.');
                return;
            }
            state.studentNames = room.students.map(s => s.name);
            state.studentCount = state.studentNames.length;
            initData();
            saveState();
            renderGrid();
            Gulliver.toast(room.className + ' ' + state.studentCount + '명을 불러왔습니다.');
        });

        // 초기화 실행
        loadState();
        renderTabs();
        renderGrid();
        window.GulliverTeacherLiveSnapshot=()=>({kind:'check',currentTheme:state.currentTheme,studentCount:state.studentCount,studentNames:[...state.studentNames],data:JSON.parse(JSON.stringify(state.data))});
        window.GulliverTeacherDisplay?.register({kind:'check',getSnapshot(){
            const checked=Object.values(state.data[state.currentTheme]||{}).filter(Boolean).length;
            return{kind:'check',theme:state.currentTheme,total:state.studentCount,checked:Math.min(checked,state.studentCount)};
        }});
        document.body.classList.add('gt-v62-check');
        GulliverTeacherClassroomFlow.mount({container:document.querySelector('body > div.w-full'),title:'제출·준비물 확인',description:'학생별 미제출 여부와 명단은 교사 화면에만 남기고, 전체 진행률만 학생 화면에 표시해요.'});

    </script>
</body>
</html>
