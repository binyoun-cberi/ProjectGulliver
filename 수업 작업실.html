<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업 작업실 · 뚝딱교실</title><link rel="icon" href="logo.png"><style>

ument-page table{border-collapse:collapse;width:100%;margin:15px 0}.document-page td{border:1px solid #cfd5e0;padding:8px;white-space:pre-wrap}.document-page p{white-space:pre-wrap}.design-page{width:min(595px,100%);align-self:flex-start}.design-page svg{width:100%;height:auto}.runbar{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px;background:white;margin-top:12px;border-radius:12px}.runbar span{min-width:90px;text-align:center}#status{font-size:12px;color:#577565;min-height:20px;margin:12px 0}#status.error{color:#ae3b4c}.running .layout{grid-template-columns:1fr}.running aside,.running .stage-head,.running .bar input,.running #editActions,.running .bar>a,.running #lessonHelp{display:none}.running .bar{justify-content:space-between}.running .bar .actions{margin:0}.running .center{padding:12px}.running .stage{min-height:calc(100vh - 185px);border:0}.running #status{display:none}.running .slide-page{max-width:1250px}.music-host{display:flex;align-items:center;gap:8px;font-size:11px}.music-host audio{height:30px;max-width:220px}.library-list{display:grid;gap:8px}.library-list button{text-align:left;font-size:12px}dialog{width:min(620px,calc(100% - 28px));border:1px solid var(--line);border-radius:17px;padding:24px;color:var(--ink);max-height:85vh;overflow:auto}dialog::backdrop{background:#26334b66}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialog-top h2{margin:0}.upload{display:block;padding:10px;border:1px dashed #c3b2e7;border-radius:9px;color:var(--brand);text-align:center}.loading{padding:45px;text-align:center;color:var(--muted)}@media(max-width:1100px){.layout{grid-template-columns:170px minmax(0,1fr)}.right{grid-column:2;border-top:1px solid var(--line);border-left:0}.stage iframe.editor-frame{height:75vh}.left{grid-row:1/3}.stage{min-height:55vh}}@media(max-width:700px){.bar{padding:10px;gap:5px}.bar>a{font-size:12px}.bar input{font-size:15px;max-width:none}.bar button{font-size:11p </style></head><body>
<header class="bar"><a href="뚝딱 제작실.html">← 뚝딱 제작실</a><input id="lessonTitle" aria-label="수업 이름" maxlength="100" value="새 수업"><span id="runTitle" hidden></span><div class="actions"><span id="editActions"><button id="newLesson">새 수업</button> <button id="openLesson">내 수업</button> <button id="saveLesson">저장</button> <button id="backupLesson">원본 백업</button> <label class="upload" style="display:inline-block" for="restoreLesson">원본 불러오기</label><input type="file" id="restoreLesson" accept=".json,application/json" hidden></span><button class="primary" id="startLesson">수업 시작 ▶</button><button id="exitRun" hidden>편집으로 돌아가기</button><button id="fullScreen" hidden>전체 화면</button></div><div id="musicHost" class="music-host" hidden></div></header>
<div class="layout"><aside class="left"><h2>수업 순서</h2><div id="stepList" class="step-list"></div><h2>자료 추가</h2><div class="add-grid"><button data-add="slides">📽 발표</button><button data-add="document">📝 문서</button><button data-add="design">✂ 도안</button><button data-add="video">🎬 영상</button><button data-add="audio">♫ 음악</button><button data-add="pdf">📄 PDF</button><button data-add="timer">◷ 타이머</button><button id="fromStudio">＋ 내 자료</button></div><hr class="separator"><p class="muted" id="lessonHelp">자료를 수업 순서대로 넣어 보세요. 발표·문서·도안은 여기서 바로 편집하고, 영상과 음악은 재생 구간을 정할 수 있어요.</p></aside>
<main class="center"><div class="stage-head"><strong id="stepTitle">수업을 준비해 보세요</strong><span id="modeHint" class="muted"></span><button id="previewStep" hidden>자료 미리보기</button></div><div id="stage" class="stage"></div><div id="runbar" class="runbar" hidden><button id="previous">← 이전</button><span id="counter"></span><button id="next">다음 →</button></div><p id="status" role="status" aria-live="polite"></p></main>
<aside class="right"><h2>활동 설정</h2><div id="settings"></div><hr class="separator"><p class="muted">수업과 영상·음악은 이 브라우저에 저장돼요. 다른 기기에서 쓰려면 ‘원본 백업’을 내려받아 불러오세요. 제작실에서 가져온 자료는 이 수업에 복사돼요.</p></aside></div>
<dialog id="libraryDialog"><div class="dialog-top"><h2 id="libraryTitle">내 수업</h2><button id="closeLibrary">닫기</button></div><div id="libraryList" class="library-list"></div></dialog>
<input id="mediaFile" type="file" hidden>
