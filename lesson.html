ound:white;align-self:flex-start;line-height:1.8}.document-page h1{font-size:30px}.document-page img{max-width:100%}.document-page table{border-collapse:collapse;width:100%;margin:15px 0}.document-page td{border:1px solid #cfd5e0;padding:8px;white-space:pre-wrap}.document-page p{white-space:pre-wrap}.design-page{width:min(595px,100%);align-self:flex-start}.design-page svg{width:100%;height:auto}.runbar{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px;background:white;margin-top:12px;border-radius:12px}.runbar span{min-width:90px;text-align:center}#status{font-size:12px;color:#577565;min-height:20px;margin:12px 0}#status.error{color:#ae3b4c}.canvas-step:not(.running) .layout{grid-template-columns:190px minmax(0,1fr)}.canvas-step:not(.running) .right{grid-column:2;border-left:0;border-top:1px solid var(--line)}.running .layout{grid-template-columns:1fr}.running aside,.running .stage-head,.running .bar input,.running #editActions,.running .bar>a,.running #lessonHelp{display:none}.running .bar{justify-content:space-between}.running .bar .actions{margin:0}.running .center{padding:12px}.running .stage{min-height:calc(100vh - 185px);border:0}.running #status{display:none}.running .slide-page{max-width:1250px}.music-host{display:flex;align-items:center;gap:8px;font-size:11px}.music-host audio{height:30px;max-width:220px}.library-list{display:grid;gap:8px}.library-list button{text-align:left;font-size:12px}dialog{width:min(620px,calc(100% - 28px));border:1px solid var(--line);border-radius:17px;padding:24px;color:var(--ink);max-height:85vh;overflow:auto}dialog::backdrop{background:#26334b66}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialog-top h2{margin:0}.upload{display:block;padding:10px;border:1px dashed #c3b2e7;border-radius:9px;color:var(--brand);text-align:center}.loading{padding:45px;text-align:center;color:var(--muted)}@media(max-width:1100px){.layout{grid-template-columns:170px minmax(0,1 /* Activity type is visible through color, number and text together. */
:root{--material:#6846bf;--material-soft:#f1ebff;--media:#1464a8;--media-soft:#eaf4ff;--routine:#0b746e;--routine-soft:#e9f8f4}
.left{background:#fafbff}.left h2{padding-left:10px;border-left:4px solid var(--brand);color:#4d3a87}
.step-button{border-color:#e2e6f0;background:#fff}.step-button .number{background:var(--material-soft);color:var(--material)}
.step-button[data-kind=video] .number,.step-button[data-kind=audio] .number,.step-button[data-kind=pdf] .number{background:var(--media-soft);color:var(--media)}
.step-button[data-kind=timer] .number{background:var(--routine-soft);color:var(--routine)}
.step-button[aria-current=true]{border-color:#9878e3;box-shadow:inset 4px 0 #7547e8;background:#f7f2ff}
.step-button[aria-current=true][data-kind=video],.step-button[aria-current=true][data-kind=audio],.step-button[aria-current=true][data-kind=pdf]{border-color:#8dbce6;box-shadow:inset 4px 0 var(--media);background:#f1f8ff}
.step-button[aria-current=true][data-kind=timer]{border-color:#8bd2c5;box-shadow:inset 4px 0 var(--routine);background:#effaf6}
.add-grid button{font-weight:700;text-align:left;border-color:#d9cdf6;background:var(--material-soft);color:#5139a1}
.add-grid button[data-add=video],.add-grid button[data-add=audio],.add-grid button[data-add=pdf]{border-color:#c8def5;background:var(--media-soft);color:#145d9b}
.add-grid button[data-add=timer]{border-color:#bde6d9;background:var(--routine-soft);color:#096b62}
.add-grid #fromStudio{background:white;border-style:dashed;color:#554587}.add-grid button:hover,.step-button:hover{filter:brightness(.96)}
.stage-head{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px}.stage-head strong{font-size:15px}
.stage[data-kind=canvas],.stage[data-kind=slides],.stage[data-kind=document],.stage[data-kind=design]{border-color:#d7caf6}
.stage[data-kind=video],.stage[data-kind=audio],.stage[data-kind=pdf]{border-color:#c7ddf2}
.stage[data-kind=timer]{border-color:#bce3d9}.right{background:#fcfaff}.right h2{padding-left:9px;border-left:4px solid #8663d6;color:#513e88}
#previewStep{background:var(--material-soft);color:#553ca9;border-color:#d5c4f8}.runbar{border:1px solid #d6c9f5}.runbar #next{background:var(--brand);border-color:var(--brand);color:white;font-weight:750}
@media(max-width:700px){.add-grid button{text-align:center}.stage-head{padding:8px 10px}}

<header class="bar"><a href="index.html">← 홈</a><input id="lessonTitle" aria-label="수업 이름" maxlength="100" value="새 수업"><span id="runTitle" hidden></span><div class="actions"><span id="editActions"><button id="newLesson">새 수업</button> <button id="openLesson">저장한 수업</button> <a class="library-shortcut" href="내 보관함.html">내 보관함</a> <span id="lessonSaveState" class="lesson-save-state" role="status" aria-live="polite" data-state="saved">기기 저장 준비됨</span> <button id="saveLesson">지금 저장</button> <button id="backupLesson">이 수업 백업</button> <label class="upload" style="display:inline-block" for="restoreLesson">수업 파일 불러오기</label><input type="file" id="restoreLesson" accept=".json,application/json" hidden></span><button class="primary" id="startLesson">수업 시작 ▶</button><button id="exitRun" hidden>준비 화면으로</button><button id="fullScreen" hidden>전체화면</button></div><div id="musicHost" class="music-host" hidden></div></header>


<section id="lessonPlan" class="lesson-plan" aria-label="수업 준비 정보">
 <div class="lesson-plan-intro"><strong>오늘의 수업 준비</strong><span>대상과 목표를 적고, 필요한 자료와 활동을 차례로 넣어 보세요.</span></div>
 <label for="lessonAudience">함께하는 반·대상<input id="lessonAudience" maxlength="100" placeholder="예: 열매1반 · 7세"></label>
 <label for="lessonGoal">이번 수업의 목표<input id="lessonGoal" maxlength="240" placeholder="예: 친구와 함께 나라별 인사말을 찾아본다"></label>
 <div class="lesson-plan-summary" id="lessonOverview" aria-live="polite">수업 자료 0개</div>
</section>
<div class="layout"><aside class="left"><h2>수업 순서</h2><button id="createLessonFlow" class="lesson-template" type="button">＋ 도입 · 활동 · 마무리 틀 만들기</button><div id="stepList" class="step-list"></div><h2>자료 추가</h2><div class="add-grid"><button data-add="canvas">▣ 통합 캔버스</button><button data-add="slides">📽 발표</button><button data-add="document">📝 문서</button><button data-add="design">✂ 도안</button><button data-add="video">🎬 영상</button><button data-add="audio">♫ 음악</button><button data-add="pdf">📄 PDF</button><button data-add="timer">◷ 타이머</button><button data-add="quiz">? 퀴즈</button><button id="fromStudio">＋ 보관함 자료 가져오기</button></div><hr class="separator"><p class="muted" id="lessonHelp">자료를 수업 순서대로 넣어 보세요. 통합 캔버스·발표·문서·도안은 여기서 바로 편집하고, 영상과 음악은 재생 구간을 정할 수 있어요.</p></aside>
<main class="center"><div class="stage-head"><strong id="stepTitle">수업을 준비해 보세요</strong><span id="modeHint" class="muted"></span><button id="previewStep" hidden>자료 미리보기</button></div><div id="stage" class="stage"></div>
<div id="lessonPresenter" class="presenter" hidden><button id="toggleLessonNotes" type="button" aria-expanded="false">진행 메모 보기</button><p id="lessonPresenterNotes" hidden></p></div>
<div id="runbar" class="runbar" hidden><button id="previous">← 이전</button><span id="counter"></span><button id="next">다음 →</button></div><p id="status" role="status" aria-live="polite"></p></main>
<aside class="right"><h2>활동 설정</h2><div id="settings"></div><hr class="separator"><p class="muted">수업 내용은 이 브라우저에 자동 저장돼요. 다른 기기에서 쓰려면 내 보관함의 ‘전체 ZIP 백업’을 이용하세요. 제작실에서 가져온 자료는 이 수업에 복사돼요.</p></aside></div>
<dialog id="libraryDialog"><div class="dialog-top"><h2 id="libraryTitle">내 수업</h2><button id="closeLibrary">닫기</button></div><div id="libraryList" class="library-list"></div></dialog>
<input id="mediaFile" type="file" hidden>
