<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세로셈 연습 | 클라시트</title><script src="gulliver-shared.js"></script><script src="gulliver-app-shell.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f6f3ee;color:#243042;margin:0}main{max-width:1100px;margin:85px auto 30px;padding:16px}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}label{display:grid;gap:6px;font-size:13px}button,select{padding:10px;border:1px solid #ccc;border-radius:8px;background:white}article{background:white;padding:12mm;width:190mm;max-width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}ol{display:grid;grid-template-columns:repeat(4,1fr);gap:7mm;list-style:none;padding:0;counter-reset:q}li{counter-increment:q;break-inside:avoid;position:relative;padding-top:8mm}li:before{content:counter(q);position:absolute;top:0;left:0;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);font:22px/1.6 monospace;text-align:center}.cell{aspect-ratio:1;border:1px solid #d5dbe1;display:grid;place-items:center}.result{border-color:#7baccf;color:#24608c}.place{font:10px system-ui;color:#657582}.answer{visibility:hidden;font:12px system-ui;margin:8px 0}.answers .answer{visibility:visible}.division{font-size:22px;border-top:2px solid;padding:6px;text-align:right}.large{grid-template-columns:repeat(3,1fr)}@page{size:A4;margin:10mm}@media print{body{background:white}form,.gulliver-shell{display:none!important}main{margin:0;padding:0}article{width:100%;max-width:none;padding:0}ol{gap:6mm}li{break-inside:avoid}header{margin-bottom:5mm}}
</style><main><form id="settings"><label>계산<select name="op"><option>×</option><option>÷</option><option>+</option><option>−</option></select></label><label>자리 수<select name="digits"><option value="3">세 자리</option><option value="2">두 자리 (곱셈)</option></select></label><label>올림·내림 / 나머지<select name="mode"><option value="any">섞어서</option><option value="no">없음</option><option value="yes">있음</option></select></label><label>문항 수<select name="count"><option>12</option><option>10</option><option>8</option><option>6</option></select></label><label>자리 표시<input name="places" type="checkbox"></label><button>새 문제 만들기</button><button type="button" id="studentPrint">학생용 인쇄</button><button type="button" id="teacherPrint">정답 포함 인쇄</button></form><article><header><h1>세로셈 연습</h1><span>이름: __________</span></header><p>칸에 계산 과정을 쓰고 답을 구해 보세요.</p><ol id="problems"></ol></article></main><script src="column-math.js"></script><script>
Gulliver.mountShell({title:'세로셈 연습'});const form=document.getElementById('settings'),list=document.getElementById('problems');let items=[];function render(){list.className=items.length<=8?'large':'';list.innerHTML=items.map(q=>{const cells=[];if(form.elements.places.checked)for(const c of ['','천','백','십','일'])cells.push('<span class="place">'+c+'</span>');const rows=q.op==='÷'?['',String(q.a),'','','']:['',String(q.a),q.op+' '+q.b,'',''];for(let r=0;r<rows.length;r++){const chars=rows[r].padStart(5,' ').split('');for(const c of chars)cells.push('<span class="cell '+(r===rows.length-1?'result':'')+'">'+c+'</span>')}return '<li>'+(q.op==='÷'?'<div class="division">'+q.b+' ⟌ '+q.a+'</div>':'')+'<div class="grid">'+cells.join('')+'</div><p class="answer">'+q.a+' '+q.op+' '+q.b+' = '+q.answer+'</p></li>'}).join('')}form.onsubmit=e=>{e.preventDefault();const f=form.elements;f.digits.disabled=f.op.value!=='×';items=ColumnMath.generate({op:f.op.value,digits:f.op.value==='×'?Number(f.digits.value):3,mode:f.mode.value,count:Number(f.count.value)});render()};form.elements.places.onchange=render;form.elements.op.onchange=()=>form.requestSubmit();document.getElementById('studentPrint').onclick=()=>{document.body.classList.remove('answers');print()};document.getElementById('teacherPrint').onclick=()=>{document.body.classList.add('answers');print()};window.onafterprint=()=>document.body.classList.remove('answers');form.requestSubmit();
</script></html>
