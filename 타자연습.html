<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타자 연습 | 클라시트</title><link rel="icon" href="clasheet-mark.svg"><link rel="stylesheet" href="worksheet-typing.css?v=1"></head><body><main><a href="index.html">클라시트</a><h1>타자 연습</h1><p id="notice" role="status" aria-live="polite"></p>
<section id="teacher"><p>받아쓰기 문장으로 타자 과제를 만들고 QR을 보여 주세요.</p><form id="setup"><label>언어<select id="language"><option value="korean">국어 타자</option><option value="english">영어 타자</option></select></label><label>학년<select id="grade"></select></label><label>문제 수<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label>QR 유효기간<select id="lifetime"><option value="86400000">24시간</option><option value="604800000">일주일</option></select></label><button>타자 과제 만들기</button></form>
<section id="share" hidden><h2>학생 입장 QR</h2><p id="shareSummary"></p><div id="qr"></div><p id="qrNote"></p><label>학생용 주소<input id="link" readonly></label><button id="copy" type="button">주소 복사</button><a id="preview" target="_blank" rel="noopener">학생 화면 열기 ↗</a><details><summary>학생에게 나갈 문장 확인</summary><ol id="tasks"></ol></details></section></section>
<section id="student" hidden><section id="preparation"><p>문장을 보고 똑같이 입력해 보세요. 띄어쓰기·대문자·문장 부호도 맞춰 주세요. 다 맞히면 다음 문제로 넘어가요.</p><p>각자 진행하며 결과는 이 기기에서 확인해요.</p><p id="expires"></p><button id="start">연습 시작</button></section><section id="run" hidden><div class="top"><p id="progress"></p><button id="pause">잠시 쉬기</button></div><progress id="bar"></progress><h2>보고 똑같이 입력해 보세요</h2><p id="prompt" aria-label="제시 문장"></p><label for="typing">문장 입력</label><textarea id="typing" rows="3" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea><p id="feedback" role="status" aria-live="polite"></p><button id="skip">다음 문제</button><button id="resume" hidden>이어서 연습</button></section><section id="result" hidden><h2>연습 결과</h2><p id="score"></p><p id="skipped"></p><button id="review">넘긴 문제 다시 연습</button><button id="restart">전체 다시 연습</button></section></section>
</main><script src="vendor/qrcode.js"></script><script src="vendor/qrcode-utf8.js"></script><script src="worksheet-dictation-topics.js"></script><script src="worksheet-dictation-levels.js"></script><script src="worksheet-dictation-data.js"></script><script src="worksheet-english-dictation.js"></script><script src="worksheet-speaking.js?v=1"></script><script src="worksheet-speaking-recognition.js?v=4"></script><script src="worksheet-typing-ui.js?v=1"></script></body></html>
