<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시 받아쓰기 | 클라시트</title><link rel="icon" href="clasheet-mark.svg"><link rel="stylesheet" href="worksheet-poetry.css?v=1"><script src="worksheet-poetry-data.js?v=2" defer></script><script src="worksheet-dictation-player.js?v=20261027-five" defer></script><script src="worksheet-poetry-ui.js?v=1" defer></script></head><body><main>
<header><a href="받아쓰기.html">← 받아쓰기로 돌아가기</a><h1>시를 듣고, 마음에 담아요</h1><p>아름다운 구절을 천천히 듣고 써 보세요.</p></header>
<section class="controls" aria-label="시 받아쓰기 설정"><label>작품<select id="poem"></select></label><label>연습 방법<select id="mode"><option value="short">짧은 구절 · 한 행씩</option><option value="blank">빈칸 받아쓰기</option><option value="stanza">한 연 받아쓰기</option></select></label><label>시작 위치<select id="start"></select></label><label>문제 수<select id="count"><option>1</option><option>3</option><option selected>5</option><option>10</option><option>20</option></select></label><label>읽는 횟수<select id="repeats"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>읽기 속도<select id="rate"><option value="0.65">아주 천천히</option><option value="0.85" selected>천천히</option><option value="1">보통</option></select></label><label>반복 사이 쉬기<select id="repeatGap"><option value="0">바로 읽기</option><option value="5" selected>5초</option><option value="10">10초</option><option value="30">30초</option></select></label><label>다음 구절까지<select id="nextGap"><option value="10">10초</option><option value="20" selected>20초</option><option value="30">30초</option><option value="60">1분</option><option value="300">5분</option></select></label><label>한국어 목소리<select id="voice"></select></label><button id="make">문제지 만들기</button></section>
<section class="playback"><button id="play">듣기 시작</button><button id="pause">잠시 멈추기</button><button id="again">현재 구절 다시 듣기</button><button id="stop">처음으로</button><p id="status" role="status" aria-live="polite"></p><label><input type="checkbox" id="answers"> 교사용 정답 보기 · 인쇄에도 표시</label><button id="print">인쇄하기</button></section>
<article id="paper"><h2 id="title"></h2><p id="author"></p><p>이름: ______________　날짜: ______________</p><p id="summary"></p><p id="edition"></p><ol id="questions"></ol><footer id="credit"></footer></article><details class="source"><summary>작품 출처와 학습용 표기 안내</summary><p id="changes"></p><p>행의 순서를 유지했습니다. 작품에 따라 구절 묶음은 학습 분량에 맞추어 구성했으니 아래 변경 안내를 확인해 주세요. 이 자료는 옛 판본의 복제본이 아니라 받아쓰기를 위한 학습용 표기입니다. 시적 표현·옛말은 오늘날의 일상 표현과 다를 수 있어요.</p><a id="source" target="_blank" rel="noopener">원문 판본 보기 ↗</a></details>
</main></body></html>
