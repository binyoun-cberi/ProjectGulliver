<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제지 만들기 | 클라시트</title><link rel="icon" type="image/svg+xml" href="clasheet-mark.svg?v=20261023-1">
<link rel="stylesheet" href="gulliver-design.css?v=20261023-clasheet1"><link rel="stylesheet" href="daily-worksheet.css?v=20261023-inline1">
<script src="gulliver-app-shell.js?v=20261023-clasheet1"></script></head><body>
<main class="daily-layout" id="gulliverWork">
 <header class="daily-intro"><div><span class="eyebrow">클라시트 · 문제지 만들기</span><h1>오늘 필요한 문제를 바로 뽑아요</h1><p>학년과 단원, 세부 유형을 고르면 새 문제지와 정답을 만듭니다. 인쇄 창에서 PDF로도 저장할 수 있어요.</p></div><a href="index.html?view=tools" class="quiet-link">교사 도구 보기 →</a></header>
 <div class="daily-workspace">
  <form id="sheetForm" class="daily-settings"><h2>문제 설정</h2><fieldset><legend>교과</legend><div id="subjectOptions" class="subject-options"></div></fieldset>
   <label>학년<select id="grade" name="grade"></select></label><label>단원<select id="unit" name="unit"></select></label><label>학습 내용<select id="topic" name="topic"></select></label><label id="typeSetting" hidden>문제 유형<select id="type" name="type"></select></label><p class="curriculum-note" id="curriculumNote" aria-live="polite"></p>
   <label id="difficultySetting">수학 난이도<select id="difficulty" name="difficulty"><option value="basic">기본</option><option value="challenge">도전</option></select></label>
   <label id="variantSetting" hidden>세 자리 수 덧셈 유형<select id="variant" name="variant"><option value="tens">A · 일의 자리가 0인 덧셈</option><option value="ones">B · 일의 자리까지 덧셈</option></select></label>
   <label>문항 수<select id="count" name="count"><option value="5">5문항</option><option value="10" selected>10문항</option><option value="15">15문항</option><option value="24">24문항 · 한 장 연산</option></select></label>
   <label class="print-option"><input id="largePrint" type="checkbox"> 큰 글씨로 인쇄</label>
   <button class="daily-primary" type="submit">문제지 만들기</button><p class="scope-note">단원 이름은 유형을 찾기 위한 분류입니다. 교과서의 단원 순서는 출판사마다 다르며, 성취기준은 원문과 대조한 연습 유형에만 표시합니다.</p>
  </form>
  <section class="daily-output" aria-label="생성한 문제지"><div class="output-actions"><div><strong id="sheetStatus">문제지를 준비하고 있어요.</strong><small id="sheetMeta"></small></div><div class="output-buttons"><button id="regenerate" type="button">↻ 새 문제로 다시 뽑기</button><button id="toggleAnswers" type="button" aria-expanded="false" aria-controls="questionSheet">정답 보기</button><button id="printOnly" type="button">문제지만 인쇄</button><button id="printWithAnswers" type="button">정답을 쓴 문제지 인쇄</button></div></div>
   <div class="paper-stack"><article class="paper" id="questionSheet"><div class="paper-topline">클라시트 <span>국어 · 수학 · 사회 · 과학 · 영어</span></div><div class="answer-heading"><h2 id="paperTitle"></h2><div class="answer-qr teacher-qr" id="answerQr" hidden><div id="answerQrCode"></div><span>교사용 · 같은 문제지 다시 열기</span></div></div><p class="paper-standard" id="paperStandard" hidden></p><div class="student-line"><span>이름: <i></i></span><span>날짜: <i></i></span></div><p class="paper-instruction" id="paperInstruction" hidden></p><ol id="questions"></ol><footer id="sheetNumber"></footer></article></div>
  </section>
 </div>
</main><script src="vendor/qrcode.js"></script><script src="daily-worksheet-core.js?v=20261023-evidence3"></script><script src="daily-worksheet.js?v=20261023-evidence3"></script></body></html>
