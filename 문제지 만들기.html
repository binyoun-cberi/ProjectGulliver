<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제지 만들기 | 매일 수업</title><link rel="icon" href="logo.png">
<link rel="stylesheet" href="gulliver-design.css?v=20261023-daily1"><link rel="stylesheet" href="daily-worksheet.css?v=20261023-expand1">
<script src="gulliver-app-shell.js?v=20261023-daily1"></script></head><body>
<main class="daily-layout" id="gulliverWork">
 <header class="daily-intro"><div><span class="eyebrow">매일 수업 · 문제지 만들기</span><h1>오늘 필요한 문제를 바로 뽑아요</h1><p>교과·학년·유형을 고르면 새 문제지와 정답지를 만듭니다. 인쇄 창에서 PDF로도 저장할 수 있어요.</p></div><a href="index.html?view=tools" class="quiet-link">교사 도구 보기 →</a></header>
 <div class="daily-workspace">
  <form id="sheetForm" class="daily-settings"><h2>문제 설정</h2><fieldset><legend>교과</legend><div id="subjectOptions" class="subject-options"></div></fieldset>
   <label>학년<select id="grade" name="grade"></select></label><label>배울 내용<select id="topic" name="topic"></select></label>
   <label id="difficultySetting">수학 난이도<select id="difficulty" name="difficulty"><option value="basic">기본</option><option value="challenge">도전</option></select></label>
   <label>문항 수<select id="count" name="count"><option value="5">5문항</option><option value="10" selected>10문항</option><option value="15">15문항</option></select></label>
   <label class="print-option"><input id="largePrint" type="checkbox"> 큰 글씨로 인쇄</label>
   <button class="daily-primary" type="submit">문제지 만들기</button><p class="scope-note">학년별로 제공하는 내용을 선택할 수 있어요. 글 읽기 문제는 한 장 안에서 같은 글을 반복하지 않습니다.</p>
  </form>
  <section class="daily-output" aria-label="생성한 문제지"><div class="output-actions"><div><strong id="sheetStatus">문제지를 준비하고 있어요.</strong><small id="sheetMeta"></small></div><div class="output-buttons"><button id="regenerate" type="button">↻ 새 문제로 다시 뽑기</button><button id="toggleAnswers" type="button" aria-expanded="false" aria-controls="answerSheet">정답 보기</button><button id="printOnly" type="button">문제지만 인쇄</button><button id="printWithAnswers" type="button">문제지 + 정답 인쇄</button></div></div>
   <div class="paper-stack"><article class="paper" id="questionSheet"><div class="paper-topline">매일 수업 <span>국어 · 수학 · 사회 · 과학 · 영어</span></div><h2 id="paperTitle"></h2><div class="student-line"><span>이름: <i></i></span><span>날짜: <i></i></span></div><ol id="questions"></ol><footer id="sheetNumber"></footer></article>
   <article class="paper answer-sheet" id="answerSheet" hidden><div class="paper-topline">매일 수업 <span>정답지</span></div><h2 id="answerTitle"></h2><ol id="answers"></ol><p class="answer-note">학생에게는 문제지 페이지만 나눠 주세요.</p></article></div>
  </section>
 </div>
</main><script src="daily-worksheet-core.js?v=20261023-expand1"></script><script src="daily-worksheet.js?v=20261023-expand1"></script></body></html>
