<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제지 만들기 | 클라시트</title><link rel="icon" type="image/svg+xml" href="clasheet-mark.svg?v=20261023-1">
<link rel="stylesheet" href="gulliver-design.css?v=20261023-clasheet1"><link rel="stylesheet" href="daily-worksheet.css?v=20261024-balanced-metrics1">
<script src="gulliver-app-shell.js?v=20261023-clasheet1"></script><link rel="stylesheet" href="daily-column-math.css?v=20261024-integrated1"></head><body>
<main class="daily-layout" id="gulliverWork">
 <header class="daily-intro"><div><span class="eyebrow">클라시트 · 문제지 만들기</span><h1>수업에 맞는 문제지를 만들어 보세요</h1><p>학년과 배울 내용을 고르면 문제지가 만들어져요. 문제마다 답을 쓸 자리도 마련하고, 인쇄하거나 PDF로 저장할 수 있어요.</p></div><a href="index.html?view=tools" class="quiet-link">교사 도구 보기 →</a></header>
 <div class="daily-workspace">
  <form id="sheetForm" class="daily-settings"><h2>문제 설정</h2><fieldset><legend>교과</legend><div id="subjectOptions" class="subject-options"></div></fieldset>
   <label>학년<select id="grade" name="grade"></select></label><label id="unitSetting">단원<select id="unit" name="unit"></select></label><label id="topicSetting">학습 내용<select id="topic" name="topic"></select></label><fieldset id="historyEraSetting" class="history-eras" hidden><legend>넣을 시대 · 여러 개 선택 가능</legend><label><input type="checkbox" value="prehistoric"> 선사와 고조선</label><label><input type="checkbox" value="ancient"> 삼국·가야·발해</label><label><input type="checkbox" value="goryeo"> 고려</label><label><input type="checkbox" value="joseon"> 조선</label><label><input type="checkbox" value="modern"> 근현대</label></fieldset><fieldset id="mathTypeSetting" class="math-types" hidden><legend>넣을 수학 유형 · 여러 개 선택 가능</legend><div id="mathTypeOptions"></div></fieldset><label id="typeSetting" hidden>세부 내용<select id="type" name="type"></select></label><label id="responseSetting" hidden>문제 유형<select id="responseFormat" name="responseFormat"></select></label><p class="curriculum-note" id="curriculumNote" aria-live="polite"></p>
   <label id="difficultySetting">수학 난이도<select id="difficulty" name="difficulty"><option value="basic">기본</option><option value="challenge">도전</option></select></label>
   <label id="variantSetting" hidden>세 자리 수 덧셈 유형<select id="variant" name="variant"><option value="tens">A · 일의 자리가 0인 덧셈</option><option value="ones">B · 일의 자리까지 덧셈</option></select></label>
   <fieldset id="columnSettings" hidden><legend>세로셈 설정</legend><label><span id="columnModeLabel">받아올림</span><select id="columnMode" name="columnMode"><option value="any">섞어서</option><option value="no">없음</option><option value="yes">있음</option></select></label><label class="print-option"><input id="columnPlaces" name="columnPlaces" type="checkbox"> 천·백·십·일 자리 표시</label></fieldset><label>문항 수<select id="count" name="count"><option value="6" hidden>6문항</option><option value="8" hidden>8문항</option><option value="12" hidden>12문항</option><option value="5">5문항</option><option value="10" selected>10문항</option><option value="15">15문항</option><option value="20">20문항</option></select></label>
   <label class="print-option"><input id="largePrint" type="checkbox"> 큰 글씨로 인쇄</label>
   <button class="daily-primary" type="submit">문제지 만들기</button><p class="scope-note">교과서마다 단원 순서가 다를 수 있으니, 수업 전에 문제 내용을 살펴봐 주세요.</p>
  </form>
  <section class="daily-output" aria-label="생성한 문제지"><div class="output-actions"><div><strong id="sheetStatus">문제지를 준비하고 있어요.</strong><small id="sheetMeta"></small></div><div class="output-buttons"><button id="regenerate" type="button">↻ 다른 문제로 바꾸기</button><button id="toggleAnswers" type="button" aria-expanded="false" aria-controls="questionSheet">정답 보기</button><button id="printOnly" type="button">학생용 문제지 인쇄</button><button id="printWithAnswers" type="button">교사용 정답·풀이 인쇄</button></div></div>
   <div class="paper-stack"><article class="paper" id="questionSheet"><div class="paper-topline">클라시트 <span>차근차근 풀어 보세요</span></div><div class="answer-heading"><h2 id="paperTitle"></h2><div class="answer-qr teacher-qr" id="answerQr" hidden><div id="answerQrCode"></div><span>교사용 · 같은 문제지 다시 열기</span></div></div><p class="paper-standard" id="paperStandard" hidden></p><div class="student-line"><span>이름: <i></i></span><span>날짜: <i></i></span></div><p class="paper-instruction" id="paperInstruction" hidden></p><ol id="questions"></ol><footer id="sheetNumber"></footer></article></div>
  </section>
 </div>
</main><script src="vendor/qrcode.js"></script><script src="data/history-photo-bank.js"></script><script src="column-math.js?v=20261024-integrated1"></script><script src="daily-worksheet-core.js?v=20261024-integrated1"></script><script src="daily-worksheet-pagination.js?v=20261024-balanced1"></script><script src="daily-worksheet.js?v=20261024-integrated1"></script></body></html>
