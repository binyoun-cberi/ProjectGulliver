<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>말하기 연습 | 클라시트</title><link rel="icon" href="clasheet-mark.svg"><link rel="stylesheet" href="worksheet-speaking.css?v=1"></head><body>
<main><a href="index.html" id="home">클라시트</a><h1>말하기 연습</h1><p id="notice" role="status" aria-live="polite"></p>
<section id="teacher"><p>과제를 만들고 QR을 보여 주세요. 학생마다 자기 기기에서 따로 진행해요.</p><form id="setup">
<label>언어<select id="language"><option value="korean">국어 말하기</option><option value="english">영어 스피킹</option></select></label>
<label>과제<select id="kind"><option value="word">기초 단어·짧은 표현</option><option value="sentence">문장 읽고 말하기</option><option value="custom">직접 입력</option></select></label>
<label id="gradeLabel">문장 난도<select id="grade"></select></label><label>문제 수<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
<label id="customLabel" hidden>과제 직접 입력<textarea id="text" maxlength="1600" rows="8" placeholder="한 줄에 한 단어나 문장씩 입력해 주세요."></textarea><small>문제 수 이상 입력 · 한 줄 120자, 전체 1,600자 · 학생에게 공유할 내용만 넣어 주세요.</small></label><button type="submit">말하기 과제 만들기</button></form>
<section id="share" hidden><h2>학생 입장 QR</h2><p id="shareSummary"></p><details><summary>학생에게 나갈 과제 확인</summary><ol id="taskList"></ol></details><div id="qr"></div><p id="qrNote"></p><label>학생용 주소<input id="link" readonly></label><button id="copy" type="button">주소 복사</button><a id="preview" target="_blank" rel="noopener">학생 화면 열기 ↗</a><p>이 QR을 함께 찍어도 진행은 각자 달라요. 교사 화면에는 학생의 결과가 전송되지 않아요.</p></section></section>
<section id="student" hidden><p id="intro">화면의 단어나 문장을 소리 내어 말해 보세요. 말한 뒤 스스로 다음 문제로 넘어가요. 녹음이나 자동 채점은 하지 않아요.</p><button id="start" type="button">연습 시작</button><div id="run" hidden><p id="progress" role="status"></p><progress id="bar"></progress><p id="prompt"></p><div class="actions"><button id="done" type="button">말했어요 · 다음</button><button id="hard" type="button">다시 연습할래요</button></div><button id="pause" type="button">잠시 쉬기</button><button id="resume" type="button" hidden>이어서 연습</button></div><section id="result" hidden><h2>끝까지 연습했어요!</h2><p id="summary"></p><p>완료 표시는 스스로 누른 기록이에요. 발음이나 유창성 점수가 아니에요.</p><button id="review" type="button">어려웠던 것 다시 연습</button><button id="restart" type="button">전체 다시 연습</button></section></section>
</main><script src="vendor/qrcode.js"></script><script src="vendor/qrcode-utf8.js"></script><script src="worksheet-dictation-topics.js"></script><script src="worksheet-dictation-levels.js"></script><script src="worksheet-dictation-data.js"></script><script src="worksheet-english-dictation.js"></script><script src="worksheet-speaking.js?v=1"></script><script src="worksheet-speaking-ui.js?v=1"></script></body></html>
