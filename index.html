<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교실 뚝딱도구 | 교사용 프로그램 모음</title>
  
  <script defer src="/_vercel/insights/script.js"></script>
  
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg: #f6f3ee;
      --paper: #fffdf8;
      --paper-2: #ffffff;
      --ink: #243042;
      --muted: #697386;
      --line: #e9dfcf;
      --brand: #6d5dfc;
      --brand-2: #ffb86b;
      --brand-3: #2fbf9b;
      --danger: #ef6461;
      --shadow: 0 18px 45px rgba(63, 54, 38, .12);
      --shadow-soft: 0 10px 25px rgba(63, 54, 38, .08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 184, 107, .28), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(109, 93, 252, .18), transparent 26%),
        linear-gradient(135deg, #fffaf1 0%, var(--bg) 45%, #eef8f4 100%);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    /* [변경] 브랜드 마크 스타일 수정: 이미지 중앙 배치 및 흰색 배경 */
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,.8);
      
      /* 이미지용 설정: 기존 그라데이션 제거 후 흰색 배경, 오버플로우 숨김 */
      background: white; 
      overflow: hidden; 
    }
    
    /* [추가] 로고 이미지 스타일: 영역 가득 채우기 */
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title strong {
      font-size: 22px;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }


    .site-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .site-nav a {
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 950;
      color: #536073;
      white-space: nowrap;
    }
    .site-nav a.active { background: var(--ink); color: white; }

    .teacher-badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      border: 1px solid rgba(255, 255, 255, .95);
      box-shadow: var(--shadow-soft);
      color: #66543f;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,253,248,.78)),
        linear-gradient(135deg, rgba(109,93,252,.12), rgba(255,184,107,.18));
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      padding: 42px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(109,93,252,.15), transparent 62%);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.28fr .72fr;
      gap: 32px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff4dc;
      color: #9a5a12;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 18px;
      border: 1px solid #ffe0aa;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: .98;
      letter-spacing: -0.075em;
    }

    .hero p {
      margin: 18px 0 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      word-break: keep-all;
      font-weight: 650;
    }

    .hero-actions {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 12px 22px rgba(109,93,252,.22); }
    .btn-ghost { background: white; color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-soft); }

    .quick-panel {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .quick-panel h2 {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: -0.04em;
    }

    .quick-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .quick-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--paper);
      color: #526070;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid #f0e9de;
    }

    .toolbar {
      margin: 18px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.78);
      box-shadow: var(--shadow-soft);
      border-radius: 18px;
      padding: 16px 18px 16px 46px;
      outline: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 15px;
      color: var(--ink);
    }

    .search span {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.76);
      color: #536073;
      border-radius: 999px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    .chip.active {
      background: var(--ink);
      color: white;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.055em;
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      background: rgba(255,255,255,.7);
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.9);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      padding: 22px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: rgba(109,93,252,.28);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent), rgba(255,255,255,0));
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, white);
    }

    .tag {
      padding: 8px 10px;
      border-radius: 999px;
      background: #f7f4ee;
      color: #6a6070;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .card h3 {
      margin: 18px 0 8px;
      font-size: 24px;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      word-break: keep-all;
      font-weight: 650;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      background: #faf7f1;
      color: #6a7280;
      font-size: 12px;
      font-weight: 850;
      border: 1px solid #eee4d5;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .open-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 950;
      color: var(--accent);
      letter-spacing: -0.03em;
    }

    .filename {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #9a9388;
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      display: none;
      padding: 28px;
      text-align: center;
      border-radius: 22px;
      background: rgba(255,255,255,.7);
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed #ddcfbd;
    }

    .guide {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .guide-box {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }

    .guide-box h3 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: -0.04em;
    }

    .guide-box p, .guide-box code {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 750;
      word-break: keep-all;
    }

    .guide-box code {
      display: block;
      margin-top: 8px;
      padding: 12px;
      border-radius: 14px;
      background: #2a3140;
      color: #fff6df;
      overflow-x: auto;
      word-break: normal;
      white-space: pre;
    }

    footer {
      margin-top: 30px;
      color: #8a8277;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 980px) {
      .hero-grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr; }
      .chips { justify-content: flex-start; }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 22px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; }
      .brand-title strong { font-size: 18px; }
      .brand-title span { white-space: normal; }
  
    .site-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .site-nav a {
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 950;
      color: #536073;
      white-space: nowrap;
    }
    .site-nav a.active { background: var(--ink); color: white; }

    .teacher-badge { display: none; }
      .hero { padding: 26px 20px; }
      .hero p { font-size: 15px; }
      .cards { grid-template-columns: 1fr; }
      .guide { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .card { min-height: 220px; }
    }
  </style>
</head>

    const cardsEl = document.getElementById("cards");
    const chipsEl = document.getElementById("chips");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");
    let activeCategory = "전체";

    function getCategories() {
      return ["전체", ...Array.from(new Set(tools.map(tool => tool.category)))];
    }

    function renderChips() {
      chipsEl.innerHTML = getCategories().map(category => `
        <button class="chip ${category === activeCategory ? "active" : ""}" type="button" onclick="setCategory('${category}')">
          ${category}
        </button>
      `).join("");
    }

    function setCategory(category) {
      activeCategory = category;
      renderChips();
      renderCards();
    }

    function normalize(text) {
      return String(text || "").toLowerCase().replace(/\s+/g, "");
    }

    function renderCards() {
      const keyword = normalize(searchInput.value);
      const filtered = tools.filter(tool => {
        const categoryMatch = activeCategory === "전체" || tool.category === activeCategory;
        const haystack = normalize([
          tool.name,
          tool.subtitle,
          tool.category,
          tool.href,
          tool.situation,
          ...(tool.tags || [])
        ].join(" "));
        return categoryMatch && (!keyword || haystack.includes(keyword));
      });

      resultCount.textContent = `${filtered.length}개 도구`;
      emptyState.style.display = filtered.length ? "none" : "block";
      cardsEl.innerHTML = filtered.map(tool => `
        <a class="card" href="${tool.href}" style="--accent:${tool.accent}" title="${tool.name} 열기">
          <div>
            <div class="card-top">
              <div class="icon">${tool.icon}</div>
              <span class="tag">${tool.category}</span>
            </div>
            <h3>${tool.name}</h3>
            <p>${tool.subtitle}</p>
            <div class="meta">
              ${(tool.tags || []).map(tag => `<span>#${tag}</span>`).join("")}
            </div>
          </div>
          <div class="card-bottom">
            <span class="open-text">열기 <span aria-hidden="true">→</span></span>
            <span class="filename">${tool.href}</span>
          </div>
        </a>
      `).join("");
    }

    function copySiteTip() {
      const text = "교사용 프로그램 모음 사이트입니다. 필요한 도구 카드를 눌러 바로 실행하시면 됩니다.";
      navigator.clipboard?.writeText(text).then(() => {
        alert("공유 안내 문구를 복사했습니다.");
      }).catch(() => {
        prompt("아래 문구를 복사하세요.", text);
      });
    }

    searchInput.addEventListener("input", renderCards);
    renderChips();
    renderCards();
  </script>
