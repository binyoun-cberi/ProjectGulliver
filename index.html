<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교실 뚝딱도구 | 교사용 프로그램 모음</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg: #f6f3ee;
      --paper: #fffdf8;
      --paper-2: #ffffff;
      --ink: #243042;
      --muted: #697386;
      --line: #e9dfcf;
      --brand: #6d5dfc;
      --brand-2: #ffb86b;
      --brand-3: #2fbf9b;
      --danger: #ef6461;
      --shadow: 0 18px 45px rgba(63, 54, 38, .12);
      --shadow-soft: 0 10px 25px rgba(63, 54, 38, .08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 184, 107, .28), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(109, 93, 252, .18), transparent 26%),
        linear-gradient(135deg, #fffaf1 0%, var(--bg) 45%, #eef8f4 100%);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    /* [변경] 브랜드 마크 스타일 수정: 이미지 중앙 배치 및 흰색 배경 */
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,.8);
      
      /* 이미지용 설정: 기존 그라데이션 제거 후 흰색 배경, 오버플로우 숨김 */
      background: white; 
      overflow: hidden; 
    }
    
    /* [추가] 로고 이미지 스타일: 영역 가득 채우기 */
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title strong {
      font-size: 22px;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }


    .site-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .site-nav a {
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 950;
      color: #536073;
      white-space: nowrap;
    }
    .site-nav a.active { background: var(--ink); color: white; }

    .teacher-badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      border: 1px solid rgba(255, 255, 255, .95);
      box-shadow: var(--shadow-soft);
      color: #66543f;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,253,248,.78)),
        linear-gradient(135deg, rgba(109,93,252,.12), rgba(255,184,107,.18));
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      padding: 42px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(109,93,252,.15), transparent 62%);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.28fr .72fr;
      gap: 32px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff4dc;
      color: #9a5a12;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 18px;
      border: 1px solid #ffe0aa;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: .98;
      letter-spacing: -0.075em;
    }

    .hero p {
      margin: 18px 0 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      word-break: keep-all;
      font-weight: 650;
    }

    .hero-actions {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 12px 22px rgba(109,93,252,.22); }
    .btn-ghost { background: white; color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-soft); }

    .quick-panel {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .quick-panel h2 {
      margin: 0 0 12px;
      font-size: 17px;
      letter-spacing: -0.04em;
    }

    .quick-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .quick-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--paper);
      color: #526070;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid #f0e9de;
    }

    .toolbar {
      margin: 18px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.78);
      box-shadow: var(--shadow-soft);
      border-radius: 18px;
      padding: 16px 18px 16px 46px;
      outline: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 15px;
      color: var(--ink);
    }

    .search span {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.76);
      color: #536073;
      border-radius: 999px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    .chip.active {
      background: var(--ink);
      color: white;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.055em;
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      background: rgba(255,255,255,.7);
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.9);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      padding: 22px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: rgba(109,93,252,.28);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent), rgba(255,255,255,0));
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, white);
    }

    .tag {
      padding: 8px 10px;
      border-radius: 999px;
      background: #f7f4ee;
      color: #6a6070;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .card h3 {
      margin: 18px 0 8px;
      font-size: 24px;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      word-break: keep-all;
      font-weight: 650;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      background: #faf7f1;
      color: #6a7280;
      font-size: 12px;
      font-weight: 850;
      border: 1px solid #eee4d5;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .open-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 950;
      color: var(--accent);
      letter-spacing: -0.03em;
    }

    .filename {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #9a9388;
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      display: none;
      padding: 28px;
      text-align: center;
      border-radius: 22px;
      background: rgba(255,255,255,.7);
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed #ddcfbd;
    }

    .guide {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .guide-box {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
    }

    .guide-box h3 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: -0.04em;
    }

    .guide-box p, .guide-box code {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 750;
      word-break: keep-all;
    }

    .guide-box code {
      display: block;
      margin-top: 8px;
      padding: 12px;
      border-radius: 14px;
      background: #2a3140;
      color: #fff6df;
      overflow-x: auto;
      word-break: normal;
      white-space: pre;
    }

    footer {
      margin-top: 30px;
      color: #8a8277;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 980px) {
      .hero-grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr; }
      .chips { justify-content: flex-start; }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 22px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; }
      .brand-title strong { font-size: 18px; }
      .brand-title span { white-space: normal; }
  
    .site-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
    }
    .site-nav a {
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 950;
      color: #536073;
      white-space: nowrap;
    }
    .site-nav a.active { background: var(--ink); color: white; }

    .teacher-badge { display: none; }
      .hero { padding: 26px 20px; }
      .hero p { font-size: 15px; }
      .cards { grid-template-columns: 1fr; }
      .guide { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .card { min-height: 220px; }
    }
  
    .dashboard {
      display:grid; grid-template-columns:1.05fr .95fr .95fr; gap:14px; margin:18px 0 22px;
    }
    .dash-card {
      background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.95);
      border-radius:20px; padding:18px; box-shadow:var(--shadow-soft); min-height:152px;
    }
    .dash-head {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .dash-head h2 {margin:0;font-size:16px;letter-spacing:-.04em}
    .dash-link {font-size:12px;font-weight:900;color:var(--brand);text-decoration:none}
    .class-name {font-size:24px;font-weight:950;letter-spacing:-.05em;margin:2px 0 6px}
    .class-meta {color:var(--muted);font-size:13px;font-weight:800}
    .student-preview {display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    .student-preview span {padding:6px 8px;border-radius:999px;background:#f4f1ff;color:#5b4dd8;font-size:11px;font-weight:850}
    .mini-list {display:grid;gap:7px}
    .mini-tool {display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
    .mini-tool a {min-width:0;padding:9px 10px;border-radius:12px;background:#faf8f4;border:1px solid #eee7dc;color:#475569;font-size:12px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mini-tool button {width:34px;height:34px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;font-size:17px}
    .dash-empty {padding:12px 0;color:#94a3b8;font-size:12px;font-weight:800}
    @media (max-width:980px){.dashboard{grid-template-columns:1fr 1fr}.dash-card:first-child{grid-column:1/-1}}
    @media (max-width:640px){.dashboard{grid-template-columns:1fr}.dash-card:first-child{grid-column:auto}.site-nav{max-width:58vw;overflow-x:auto;justify-content:flex-start}.site-nav a{padding:9px 11px}}

    .area-section { margin: 10px 0 22px; }
    .area-head { display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 14px; }
    .area-head h2 { margin:0;font-size:24px;letter-spacing:-.055em; }
    .area-head p { margin:6px 0 0;color:var(--muted);font-size:14px;font-weight:750; }
    .area-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px; }
    .area-card {
      --area:#6d5dfc;
      position:relative;overflow:hidden;text-align:left;border:1px solid rgba(255,255,255,.96);
      border-radius:22px;padding:20px;background:rgba(255,255,255,.83);box-shadow:var(--shadow-soft);
      cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    .area-card:hover { transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--area) 32%,white); }
    .area-card.active { outline:3px solid color-mix(in srgb,var(--area) 20%,transparent);border-color:var(--area); }
    .area-card::before { content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--area),transparent); }
    .area-icon { width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--area) 12%,white); }
    .area-card h3 { margin:14px 0 6px;font-size:20px;letter-spacing:-.05em; }
    .area-card p { margin:0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:700;min-height:42px; }
    .area-foot { display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px; }
    .area-count { font-size:12px;font-weight:900;color:var(--area); }
    .area-arrow { font-size:18px;color:var(--area);font-weight:900; }
    .section-kicker {display:inline-flex;padding:6px 9px;border-radius:999px;background:#f6f3ff;color:#5b4dd8;font-size:11px;font-weight:950;margin-bottom:6px}
    @media(max-width:980px){.area-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:640px){.area-grid{grid-template-columns:1fr 1fr;gap:10px}.area-card{padding:16px}.area-card p{min-height:0}.area-icon{width:42px;height:42px;font-size:23px}.area-card h3{font-size:17px}}
</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="교실 뚝딱도구 홈">
        <div class="brand-mark">
          <img src="logo.png" alt="교실 뚝딱도구 로고">
        </div>
        <div class="brand-title">
          <strong>교실 뚝딱도구</strong>
          <span>학급운영 · 수업 · 업무 · 편의성을 한곳에</span>
        </div>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a class="active" href="index.html">홈</a>
        <a href="https://binyoun-cberi.github.io/kidscade/" target="_blank" title="새 창으로 열기">키즈케이드 ↗</a>
      </nav>
    </header>


    <section class="dashboard" aria-label="교실 대시보드">
      <article class="dash-card">
        <div class="dash-head"><h2>👥 우리 반</h2><a class="dash-link" href="우리반.html">운영 정보 관리 →</a></div>
        <div class="class-name" id="dashClassName">우리 반</div>
        <div class="class-meta" id="dashClassMeta">저장된 학생이 없습니다.</div>
        <div class="student-preview" id="dashStudentPreview"></div>
      </article>
      <article class="dash-card">
        <div class="dash-head"><h2>🕘 최근 사용</h2><span class="class-meta">이 브라우저 기준</span></div>
        <div class="mini-list" id="recentTools"></div>
      </article>
      <article class="dash-card">
        <div class="dash-head"><h2>⭐ 즐겨찾기</h2><span class="class-meta">최근 사용에서 ☆ 추가</span></div>
        <div class="mini-list" id="favoriteTools"></div>
      </article>
    </section>


    <section class="area-section" aria-label="똑똑 영역 선택">
      <div class="area-head">
        <div>
          <span class="section-kicker">무엇을 하려 하나요?</span>
          <h2>똑똑 도구함</h2>
          <p>기능 이름보다 지금 하려는 일에 맞춰 들어가세요.</p>
        </div>
      </div>
      <div class="area-grid" id="areaGrid"></div>
    </section>

    <section id="tools">
      <div class="toolbar">
        <label class="search" aria-label="도구 검색">
          <span>🔎</span>
          <input id="searchInput" type="search" placeholder="도구 이름, 상황, 키워드로 검색하기" autocomplete="off" />
        </label>
        <div class="chips" id="chips"></div>
      </div>

      <div class="section-head">
        <div>

    const cardsEl = document.getElementById("cards");
    const chipsEl = document.getElementById("chips");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");
    const AREAS = [
      { name:"똑똑 학급운영", icon:"👥", color:"#2fbf9b", desc:"자리·역할·투표·체크·모둠처럼 우리 반을 운영하는 도구" },
      { name:"똑똑 수업", icon:"📚", color:"#6d5dfc", desc:"타이머·퀴즈·게임·수업 안내처럼 수업 시간에 바로 쓰는 도구" },
      { name:"똑똑 업무", icon:"🗂️", color:"#f59e0b", desc:"성취기준·세특·자료 보관처럼 준비와 기록을 줄여주는 도구" },
      { name:"똑똑 편의성", icon:"🛠️", color:"#3b82f6", desc:"QR처럼 작지만 자주 생기는 교실의 귀찮음을 해결하는 도구" }
    ];
    let activeCategory = "전체";

    function getCategories() {
      return ["전체", ...AREAS.map(area => area.name)];
    }

    function renderChips() {
      chipsEl.innerHTML = getCategories().map(category => `
        <button class="chip ${category === activeCategory ? "active" : ""}" type="button" onclick="setCategory('${category}')">
          ${category === "전체" ? "전체" : category.replace("똑똑 ","")}
        </button>
      `).join("");
    }

    function renderAreas() {
      const areaGrid = document.getElementById("areaGrid");
      areaGrid.innerHTML = AREAS.map(area => {
        const count = tools.filter(tool => tool.category === area.name).length;
        return `
          <button class="area-card ${activeCategory === area.name ? "active" : ""}" style="--area:${area.color}" type="button" onclick="openArea('${area.name}')">
            <div class="area-icon">${area.icon}</div>
            <h3>${area.name}</h3>
            <p>${area.desc}</p>
            <div class="area-foot"><span class="area-count">${count}개 도구</span><span class="area-arrow">→</span></div>
          </button>`;
      }).join("");
    }

    function openArea(category) {
      setCategory(category);
      document.getElementById("tools").scrollIntoView({behavior:"smooth", block:"start"});
    }

    function setCategory(category) {
      activeCategory = category;
      renderChips();
      renderAreas();
      renderCards();
    }

    function normalize(text) {
      return String(text || "").toLowerCase().replace(/\s+/g, "");
    }

    function renderCards() {
      const keyword = normalize(searchInput.value);
      const filtered = tools.filter(tool => {
        const categoryMatch = activeCategory === "전체" || tool.category === activeCategory;
        const haystack = normalize([
          tool.name,
          tool.subtitle,
          tool.category,
          tool.href,
          tool.situation,
          ...(tool.tags || [])
        ].join(" "));
        return categoryMatch && (!keyword || haystack.includes(keyword));
      });

      resultCount.textContent = `${filtered.length}개 도구`;
      document.getElementById("toolSectionTitle").textContent = activeCategory === "전체" ? "전체 도구" : activeCategory;
      emptyState.style.display = filtered.length ? "none" : "block";
      cardsEl.innerHTML = filtered.map(tool => `
        <a class="card" href="${tool.href}" style="--accent:${tool.accent}" title="${tool.name} 열기" onclick="Gulliver.trackTool({name:'${tool.name}',href:'${tool.href}',icon:'${tool.icon}'})">
          <div>
            <div class="card-top">
              <div class="icon">${tool.icon}</div>
              <span class="tag">${tool.category.replace("똑똑 ","")}</span>
            </div>
            <h3>${tool.name}</h3>
            <p>${tool.subtitle}</p>
            <div class="meta">
              ${(tool.tags || []).map(tag => `<span>#${tag}</span>`).join("")}
            </div>
          </div>
          <div class="card-bottom">
            <span class="open-text">열기 <span aria-hidden="true">→</span></span>
            <span class="filename">바로 실행</span>
          </div>
        </a>
      `).join("");
    }

    function copySiteTip() {
      const text = "교사용 프로그램 모음 사이트입니다. 필요한 도구 카드를 눌러 바로 실행하시면 됩니다.";
      navigator.clipboard?.writeText(text).then(() => {
        alert("공유 안내 문구를 복사했습니다.");
      }).catch(() => {
        prompt("아래 문구를 복사하세요.", text);
      });
    }


    function renderDashboard() {
      const room = Gulliver.getClassroom();
      document.getElementById('dashClassName').textContent = room.className || '우리 반';
      const profiles=Gulliver.getProfiles?Gulliver.getProfiles():{};
      const relations=Gulliver.getRelations?Gulliver.getRelations():[];
      const profileCount=Object.values(profiles).filter(p=>p.updatedAt||p.frontSeat||p.leader||p.note||p.participation!==3||p.responsibility!==3||p.presentationBurden!==3).length;
      document.getElementById('dashClassMeta').textContent = room.students.length ? `${room.students.length}명 · 운영 프로필 ${profileCount}명 · 관계 ${relations.length}개` : '저장된 학생이 없습니다. 명단과 교사용 운영 정보를 한 번에 관리할 수 있어요.';
      document.getElementById('dashStudentPreview').innerHTML = room.students.slice(0,6).map(s=>`<span>${s.name}</span>`).join('') + (room.students.length>6 ? `<span>+${room.students.length-6}명</span>` : '');

      const favorites = Gulliver.getFavorites();
      const favSet = new Set(favorites.map(x=>x.href));
      const recent = Gulliver.getRecent();
      document.getElementById('recentTools').innerHTML = recent.length ? recent.slice(0,4).map(x=>`
        <div class="mini-tool">
          <a href="${x.href}" onclick="Gulliver.trackTool({name:'${x.name}',href:'${x.href}',icon:'${x.icon||'🧰'}'})">${x.icon||'🧰'} ${x.name}</a>
          <button type="button" data-favorite="${x.href}" title="즐겨찾기">${favSet.has(x.href)?'★':'☆'}</button>
        </div>`).join('') : '<div class="dash-empty">아직 사용한 도구가 없습니다.</div>';
      document.getElementById('favoriteTools').innerHTML = favorites.length ? favorites.slice(0,4).map(x=>`
        <div class="mini-tool">
          <a href="${x.href}" onclick="Gulliver.trackTool({name:'${x.name}',href:'${x.href}',icon:'${x.icon||'🧰'}'})">${x.icon||'⭐'} ${x.name}</a>
          <button type="button" data-favorite="${x.href}" title="즐겨찾기 해제">★</button>
        </div>`).join('') : '<div class="dash-empty">최근 사용한 도구의 ☆를 눌러 추가하세요.</div>';
      document.querySelectorAll('[data-favorite]').forEach(btn=>btn.onclick=()=>{
        const href=btn.dataset.favorite;
        const tool=tools.find(t=>t.href===href) || recent.find(t=>t.href===href) || favorites.find(t=>t.href===href);
        if(tool){Gulliver.toggleFavorite(tool);renderDashboard();}
      });
    }
    window.addEventListener('gulliver:classroom-change', renderDashboard);
    window.addEventListener('gulliver:classroom-meta-change', renderDashboard);
    window.addEventListener('gulliver:favorites-change', renderDashboard);

    searchInput.addEventListener("input", renderCards);
    renderChips();
    renderAreas();
    renderCards();
    renderDashboard();
  </script>
</body>
</html>
