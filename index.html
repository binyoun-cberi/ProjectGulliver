<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교실 뚝딱도구 | 교사용 프로그램 모음</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg: #f6f3ee;
      /* 생략된 변수들 ... */
      --brand: #6d5dfc;
      --brand-2: #ffb86b;
      --shadow-soft: 0 10px 25px rgba(63, 54, 38, .08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    /* 생략된 바디 스타일 ... */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    /* [변경사항 2] 브랜드 마크 스타일 수정 */
    .brand-mark {
      width: 48px; /* 로고 크기에 맞춰 조정 */
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,.8);
      
      /* [중요] 배경 그라데이션 제거, 흰색 배경으로 로고 강조 */
      background: white; 
      
      /* [중요] 이미지 중앙 배치 설정 */
      overflow: hidden; 
    }
    
    /* [변경사항 3] 로고 이미지 스타일 추가 */
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 이미지가 영역을 꽉 채우도록 설정 */
    }

    /* 생략된 나머지 CSS 스타일 ... */
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="교실 뚝딱도구 홈">
        <div class="brand-mark">
          <img src="logo.png" alt="교실 뚝딱도구 로고">
        </div>
        <div class="brand-title">
          <strong>교실 뚝딱도구</strong>
          <span>선생님을 위한 HTML 프로그램 모음</span>
        </div>
      </a>
    </header>

    <section id="tools">
    </section>

    <footer>
      교실 뚝딱도구 · Teacher Tools Launcher · 입력한 내용은 각 프로그램의 브라우저 안에서 처리됩니다.
    </footer>
  </div>

  <script>
  // [중요] 스크립트 내용은 기존 코드와 동일 ...
  </script>
</body>
</html>
