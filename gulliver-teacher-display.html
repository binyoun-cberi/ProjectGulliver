<body>
  <header class="display-toolbar">
    <span class="display-brand"><img src="clasheet-mark.svg?v=20261023-1" alt="" width="28" height="28"> 클라시트 <span>학생 화면</span></span>
    <div class="display-tools">
      <span id="displayConnection" role="status" aria-live="polite">교사 화면 연결 중…</span>
      <button id="displayFullscreen" type="button" aria-label="학생 화면 전체화면">⛶ 전체화면</button>

  </header>
  <main id="displayStage" class="display-stage" aria-label="학생용 수업 화면">

      <div class="waiting-symbol" aria-hidden="true">📺</div>

    </section>
  </main>
  <div id="displayAnnouncement" class="screen-reader-only" aria-live="polite" aria-atomic="true"></div>
  <footer class="display-footer">이 창을 학생용 모니터로 옮기고 전체화면으로 표시하세요. 교사용 설정과 비공개 결과는 이 화면에 나타나지 않아요.</footer>
