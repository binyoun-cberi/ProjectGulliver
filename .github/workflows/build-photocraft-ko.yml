name: Build PhotoCraft Korean web UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-photocraft-ko.yml'
      - 'scripts/patch-photocraft-ko.py'
      - 'scripts/localize-photocraft-html.py'
      - 'scripts/install-photocraft-ko-font.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gulliver-photocraft-korean-web
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'binyoun-cberi/ProjectGulliver'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '1'
      SOURCE_DIR: /tmp/photocraft-source
      EXPECTED_PHOTOCRAFT_SHA: '79261615956ab21334e49ca1d384390272e647da'
    steps:
      - name: Checkout Gulliver scripts (without credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up upstream web build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          TRUNK_VERSION=0.21.14
          ARCHIVE=trunk-x86_64-unknown-linux-musl.tar.gz
          URL="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          curl -fLSs --retry 3 -o "${RUNNER_TEMP}/${ARCHIVE}" "${URL}/${ARCHIVE}"
          curl -fLSs --retry 3 -o "${RUNNER_TEMP}/${ARCHIVE}.sha256" "${URL}/${ARCHIVE}.sha256"
          printf "%s  %s\n" "$(cat "${RUNNER_TEMP}/${ARCHIVE}.sha256")" "${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" trunk
          sudo install -m 0755 "${RUNNER_TEMP}/trunk" /usr/local/bin/trunk
          trunk --version
          rustc --version

      - name: Check out and verify PhotoCraft upstream release
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/storytold/photocraft.git "$SOURCE_DIR"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$EXPECTED_PHOTOCRAFT_SHA"
          python3 scripts/patch-photocraft-ko.py "$SOURCE_DIR"

      - name: Compile real Korean-enabled egui / Rust WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/apps/photocraft-web"
          trunk build --release --locked
          test -s "$SOURCE_DIR/dist/web/index.html"
          test "$(find "$SOURCE_DIR/dist/web" -maxdepth 1 -name '*.wasm' | wc -l)" -eq 1

      - name: Localize first launch and provide open-license Korean font
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/localize-photocraft-html.py "$SOURCE_DIR/dist/web"
          bash scripts/install-photocraft-ko-font.sh "$SOURCE_DIR/dist/web"

      - name: Verify translated and complete web bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import os

          root = Path(os.environ["SOURCE_DIR"]) / "dist/web"
          page = (root / "index.html").read_text()
          assert '<html lang="ko">' in page
          assert 'gulliver-korean-first-run' in page
          assert 'photocraft.preferences' in page
          assert 'PhotoCraft 한글판' in page
          assert 'Nanum Gothic' in (root / "fonts/manifest.txt").read_text()
          assert (root / "fonts/nanumgothic/NanumGothic-Regular.ttf").stat().st_size > 1_000_000
          assert (root / "fonts/nanumgothic/OFL.txt").stat().st_size > 100
          modules = list(root.glob("photocraft-web-*.js"))
          wasm = list(root.glob("photocraft-web-*_bg.wasm"))
          assert len(modules) == len(wasm) == 1, (modules, wasm)
          assert all(f.stat().st_size <= 26_214_400 for f in root.rglob("*") if f.is_file())
          assert len(page) > 1500
          print("Validated local Korean web bundle, size", wasm[0].stat().st_size)
          PY

      - name: Checkout current Gulliver main for publishing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          clean: true

      - name: Commit tested Korean bundle
        shell: bash
        run: |
          set -euo pipefail
          DIR="assets/artcraft/photocraft"
          test -f "$DIR/licenses/LICENSE-MIT"
          test -f "$DIR/licenses/LICENSE-APACHE"
          test -f "$DIR/licenses/NOTICE"
          test -f "$DIR/licenses/ATTRIBUTION.md"
          find "$DIR" -maxdepth 1 -type f \( -name 'photocraft-web-*.js' -o -name 'photocraft-web-*_bg.wasm' \) -delete
          cp -a "$SOURCE_DIR/dist/web/." "$DIR/"
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path("assets/artcraft/photocraft/gulliver-install.json")
          info = json.loads(path.read_text())
          assert info["version"] == "0.7.0"
          info["locale"] = "ko"
          info["ui_font"] = "Nanum Gothic (OFL-1.1)"
          path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$DIR"
          if git diff --cached --quiet; then
            echo "Korean PhotoCraft bundle already current."
            exit 0
          fi
          git commit -m "feat(artcraft): Korean PhotoCraft UI with Hangul fonts"
          git pull --rebase origin main
          git push origin HEAD:main
