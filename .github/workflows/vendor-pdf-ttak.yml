name: Install PDF Ttak web libraries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-pdf-ttak.yml'
      - 'scripts/install-pdf-ttak.sh'
  workflow_dispatch:

concurrency:
  group: gulliver-pdf-ttak-vendor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  install:
    if: github.repository == 'binyoun-cberi/ProjectGulliver'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download verified PDF processing tools
        shell: bash
        run: bash scripts/install-pdf-ttak.sh

      - name: Verify files and licenses before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/artcraft/pdfcraft/index.html
          test -s assets/artcraft/pdfcraft/gulliver-install.json
          test -s assets/artcraft/pdfcraft/licenses/LICENSE-MIT
          test -s assets/artcraft/pdfcraft/licenses/LICENSE-APACHE
          test -s assets/artcraft/pdfcraft/licenses/NOTICE
          test -s assets/artcraft/pdfcraft/licenses/ATTRIBUTION.md
          test -s vendor/pdf-lib/pdf-lib.min.js
          test -s vendor/pdf-lib/LICENSE.md
          test -s vendor/pdf-lib/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = Path('assets/artcraft/pdfcraft')
          j = json.loads((d / 'gulliver-install.json').read_text())
          assert j['source'] == 'storytold/pdfcraft' and j['version'] == '0.7.1'
          assert j['release_sha256'] == '2e58067125b2c14d92d50888a6a03351302065ff4b99c0914892a078f05dfd66'
          v = json.loads(Path('vendor/pdf-lib/version.json').read_text())
          assert v['version'] == '1.17.1'
          assert len(list(d.glob('pdfcraft-web-*_bg.wasm'))) == 1
          assert len(list(d.glob('pdfcraft-web-*.js'))) == 1
          assert all(p.stat().st_size <= 26214400 for folder in (d,Path('vendor/pdf-lib')) for p in folder.rglob('*') if p.is_file())
          assert 'PDFLib' in Path('vendor/pdf-lib/pdf-lib.min.js').read_text()[:10000]
          print('PdfCraft and pdf-lib verified, ready to publish')
          PY

      - name: Commit only installed PDF tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- assets/artcraft/pdfcraft/ vendor/pdf-lib/
          if git diff --cached --quiet; then
            echo 'Already installed.'
            exit 0
          fi
          git commit -m 'chore(pdf): vendor verified PdfCraft 0.7.1 and pdf-lib 1.17.1'
          git pull --rebase origin main
          git push origin HEAD:main
