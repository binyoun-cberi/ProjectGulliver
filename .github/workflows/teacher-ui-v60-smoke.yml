name: 6.0 teacher tool design foundation
on:
  pull_request:
    paths:
      - 'gulliver-teacher-*'
      - 'gulliver-app-shell.js'
      - 'gulliver-design.css'
      - 'class-planner-*'
      - 'tests/class-planner-*'
      - 'classroom-workspace.js'
      - 'lesson-circle-timer.js'
      - 'tests/gulliver-teacher-ui.test.cjs'
      - 'tests/gulliver-teacher-display.test.cjs'
      - 'tests/gulliver-teacher-classroom-v62.test.cjs'
      - 'tests/time-tools*.test.cjs'
      - 'time-tools-*.js'
      - 'flash-quiz-quality.js'
      - 'flash-quiz-polish.css'
      - 'tests/classroom-tools-round2.test.cjs'
      - 'classroom-allocation-audit.js'
      - 'tests/classroom-assignment-quality.test.cjs'
      - 'manitto-solver.js'
      - 'classroom-bus-audit.js'
      - 'tests/classroom-tools-round4.test.cjs'
      - 'classroom-catch-rules.js'
      - 'tournament-maker.js'
      - 'tests/classroom-tools-round5.test.cjs'
      - 'tests/teacher-tools-final-wave.test.cjs'
      - 'data-standards.js'
      - 'time-tools-*.css'
      - 'lesson-notice-flow.css'
      - 'tests/classroom-tools-improvements.test.cjs'
      - 'classroom-workspace.js'
      - '.github/workflows/teacher-ui-v60-smoke.yml'
      - 'tools-catalog.js'
      - '*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate shared teacher scripts and unified time tool
        run: |
          node --check gulliver-teacher-shell.js
          node --check gulliver-teacher-components.js
          node --check gulliver-teacher-display.js
          node --check gulliver-teacher-display-view.js
          node --check gulliver-teacher-v62.js
          node --check flash-quiz-quality.js
          node --check tests/classroom-tools-round2.test.cjs
          node --check classroom-allocation-audit.js
          node --check tests/classroom-assignment-quality.test.cjs
          node --check manitto-solver.js
          node --check classroom-bus-audit.js
          node --check tests/classroom-tools-round4.test.cjs
          node --check classroom-catch-rules.js
          node --check tournament-maker.js
          node --check tests/classroom-tools-round5.test.cjs
          node --check tests/teacher-tools-final-wave.test.cjs
          node --check data-standards.js
          node --check data-sentence.js
          node --check time-tools-hourglass.js
          node --check time-tools-core.js
          node --check time-tools-ui.js
          node --check tests/time-tools.test.cjs
          node --check tests/classroom-tools-improvements.test.cjs
          node --check tests/time-tools-browser.test.cjs
          node --check tests/gulliver-teacher-ui.test.cjs
          node --check tests/gulliver-teacher-display.test.cjs
          node --check tests/gulliver-teacher-classroom-v62.test.cjs
      - name: Install Korean fonts for representative header screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Verify class planner constraints and best-effort baskets
        run: |
          node --test tests/class-planner-*.test.cjs
          node tests/class-planner-sheet-browser.e2e.cjs
      - name: Exercise teacher tools and privacy in Chrome
        run: node --test --test-concurrency=1 tests/gulliver-teacher-ui.test.cjs tests/gulliver-teacher-display.test.cjs tests/gulliver-teacher-classroom-v62.test.cjs tests/time-tools.test.cjs tests/time-tools-browser.test.cjs tests/classroom-tools-improvements.test.cjs tests/classroom-workspace.test.cjs tests/classroom-tools-round2.test.cjs tests/classroom-assignment-quality.test.cjs tests/classroom-tools-round4.test.cjs tests/classroom-tools-round5.test.cjs tests/teacher-tools-final-wave.test.cjs
      - name: Save desktop and mobile timer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-tools-ux-review
          path: test-artifacts/time-tools-*.png
          if-no-files-found: ignore
          retention-days: 7
