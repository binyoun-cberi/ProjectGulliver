name: 5.3 lesson classroom smoke
on:
  pull_request:
    paths:
      - 'lesson-app.js'
      - 'lesson-core.js'
      - 'tests/lesson-v53*'
      - '.github/workflows/lesson-v53-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-lesson-inventory:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check whether retired lesson 5.3 source exists
        id: check
        run: |
          if [[ -f lesson-app.js && -f lesson-core.js && -f tests/lesson.test.cjs && -f tests/lesson-v53.test.cjs && -f tests/lesson-v53.e2e.cjs ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Legacy lesson 5.3 files are absent; skipping obsolete tests.'
          fi
  classroom-flow:
    needs: legacy-lesson-inventory
    if: needs.legacy-lesson-inventory.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check lesson scripts and compatibility
        run: |
          node --check lesson-app.js
          node --check lesson-core.js
          node --test tests/lesson.test.cjs tests/lesson-v53.test.cjs
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Rehearse lesson creation and classroom delivery in Chrome
        run: node --test --test-concurrency=1 tests/lesson-v53.e2e.cjs
