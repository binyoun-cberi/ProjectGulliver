name: 뚝딱 제작실 integration checks
on:
  push:
    branches:
      - main
      - feat/ttak-studio-unified-workspace-20261013
      - fix/studio-v1-1-reliable-autosave-20261013
      - feat/studio-v1-2-unified-editor-panels-20261013
      - feat/studio-v1-3-cross-tool-transfer-20261013
      - feat/studio-v1-4-library-backup-20261013
      - feat/studio-video-music-foundation-20261013
      - feat/official-filmcraft-soundcraft-web-20261013
      - fix/expose-video-music-home-20261013
      - feat/studio-v2-2-cross-media-20261013
      - feat/studio-v2-3-native-project-library-20261014
      - feat/studio-v2-4-offline-binary-backup-20261014
      - feat/studio-v3-unified-canvas-20261014
      - feat/studio-v3-1-animated-timeline-20261014
      - feat/studio-v3-2-webm-export-20261014
    paths:
      - '뚝딱 제작실.html'
      - 'studio-*.js'
      - 'doan-*.js'
      - 'balpyo-*.js'
      - 'munseo-*.js'
      - '*뚝딱.html'
      - 'tools-catalog.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/studio-checks.yml'
      - 'scripts/install-artcraft-media-web.sh'
      - '.github/workflows/vendor-artcraft-media.yml'
  pull_request:
    paths:
      - '뚝딱 제작실.html'
      - 'studio-*.js'
      - 'doan-*.js'
      - 'balpyo-*.js'
      - 'munseo-*.js'
      - '*뚝딱.html'
      - 'tools-catalog.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/studio-checks.yml'
      - 'scripts/install-artcraft-media-web.sh'
      - '.github/workflows/vendor-artcraft-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify JavaScript syntax
        run: |
          node --check studio-core.js
          node --check studio-unified-core.js
          node --check studio-unified-editor.js
          node --check studio-unified-timeline.js
          node --check studio-unified-video.js
          node --check studio-storage.js
          node --check studio-official-project-core.js
          node --check studio-app.js
          node --check studio-layout.js
          node --check studio-transfer-core.js
          node --check studio-library-core.js
          node --check studio-library.js
          node --check studio-zip-core.js
          node --check studio-zip-backup.js
          node --check studio-storage-ui.js
          node --check studio-media-core.js
          node --check studio-canvas-shell.js
          node --check music-core.js
          node --check music-ttak.js
          node --check video-ttak.js
          node --check studio-official-media.js
          node --check doan-core.js
          node --check doan-ttak.js
          node --check balpyo-core.js
          node --check balpyo-ttak.js
          node --check munseo-core.js
          node --check munseo-ttak.js
          node --check munseo-hwpx.js
      - name: Run all existing and studio integration tests
        run: node --test tests/*.test.cjs

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout site and local tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use preinstalled Google Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable
          node --version

      - name: Install pinned browser driver without package scripts
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1

      - name: Install media probe and Korean fonts for visual verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          fc-match :lang=ko

      - name: Exercise real Chromium local storage, file imports and exports
        run: node --test tests/studio-browser.e2e.cjs tests/studio-transfer.e2e.cjs tests/studio-library.e2e.cjs tests/studio-media.e2e.cjs tests/studio-visible-home.e2e.cjs tests/studio-v22.e2e.cjs tests/studio-cross-media.e2e.cjs tests/studio-official-library.e2e.cjs tests/studio-v24.e2e.cjs tests/studio-v30.e2e.cjs tests/studio-v31.e2e.cjs tests/studio-v32.e2e.cjs tests/studio-v33.e2e.cjs tests/studio-canvas-shell.e2e.cjs

      - name: Keep canvas screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-visual-review
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3

  official-media-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch SHA256-pinned original FilmCraft and SoundCraft web bundles
        run: bash scripts/install-artcraft-media-web.sh
      - name: Check web entrypoints, original release structure and licenses
        run: |
          node --test tests/studio-official-media.test.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('filmcraft','soundcraft'):
            p=Path('assets/artcraft')/name
            assert (p/'index.html').exists()
            assert any(x.stat().st_size>1000 for x in p.rglob('*.wasm'))
            assert any(x.stat().st_size>1000 for x in p.rglob('*.js'))
            print(name, [(x.relative_to(p).as_posix(), x.stat().st_size) for x in p.rglob('*') if x.is_file()][:18])
            print('INDEX:', (p/'index.html').read_text(errors='replace')[:1800])
          PY
      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Load original bundled FilmCraft and SoundCraft canvases in Chrome
        run: node --test tests/studio-official-media.e2e.cjs

