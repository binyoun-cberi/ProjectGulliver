name: 5.6 unified UI and navigation
on:
  pull_request:
    paths:
      - 'index.html'
      - '뚝딱 제작실.html'
      - '내 보관함.html'
      - 'lesson.html'
      - 'gulliver-ui-v56.css'
      - 'workspace-home.js'
      - 'studio-app.js'
      - 'studio-experience.js'
      - 'lesson-app.js'
      - 'unified-library.js'
      - 'tests/ui-v56*'
      - '.github/workflows/ui-v56-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistent-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate UI, terminology and scripts
        run: |
          node --check studio-app.js
          node --check studio-experience.js
          node --check lesson-app.js
          node --check workspace-home.js
          node --check unified-library.js
          node --check tests/ui-v56.e2e.cjs
          node --test tests/ui-v56.test.cjs tests/home-v54.test.cjs tests/lesson-v53.test.cjs
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Inspect four page sizes and save-safe navigation in Chrome
        run: node --test --test-concurrency=1 tests/ui-v56.e2e.cjs
      - name: Upload wide/phone review screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5-6-visual-review
          path: test-artifacts/ui-v56-*.png
          if-no-files-found: ignore
          retention-days: 7
