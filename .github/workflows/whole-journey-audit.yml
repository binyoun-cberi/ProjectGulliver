name: Classroom full journey QA
on:
  pull_request:
    paths:
      - 'workspace-home.js'
      - 'classroom-workspace.js'
      - 'index.html'
      - 'tests/clasheet-first-start.test.cjs'
      - '.github/workflows/whole-journey-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify current classroom workspace
        run: |
          node --check classroom-workspace.js
          node --check workspace-home.js
      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Exercise current saved activities and home navigation
        run: node --test tests/classroom-workspace.test.cjs tests/clasheet-first-start.test.cjs
