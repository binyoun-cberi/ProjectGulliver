name: Official media 2.1 browser workflows
on:
  push:
    branches:
      - main
      - fix/studio-v2-1-official-media-runtime-qa-20261013
    paths:
      - 'studio-official-media.js'
      - 'studio-app.js'
      - '영상 뚝딱.html'
      - '음악 뚝딱.html'
      - 'tests/studio-official-*.cjs'
      - '.github/workflows/media-runtime-qa.yml'
  pull_request:
    paths:
      - 'studio-official-media.js'
      - 'studio-app.js'
      - '영상 뚝딱.html'
      - '음악 뚝딱.html'
      - 'tests/studio-official-*.cjs'
      - '.github/workflows/media-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-media-real-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout with vendored original FilmCraft and SoundCraft WASM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check official media entry points and diagnostic JS
        run: |
          node --check studio-official-media.js
          node --check tests/studio-official-workflows.e2e.cjs
          node --test tests/studio-official-media.test.cjs
          test -s assets/artcraft/filmcraft/filmcraft_web_bg.wasm
          test -s assets/artcraft/soundcraft/soundcraft-web-df25e49daa9fa867_bg.wasm
      - name: Prepare a real, small H264 and AAC import fixture
        run: |
          mkdir -p tests/fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=160x90:rate=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 1.2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 48k -movflags +faststart \
            tests/fixtures/studio-qa.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name -of json tests/fixtures/studio-qa.mp4
      - name: Install pinned Playwright Chrome driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Test real import, playback, H264 export, project save/open, and SoundCraft startup
        run: node --test tests/studio-official-workflows.e2e.cjs
