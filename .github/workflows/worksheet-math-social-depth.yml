name: Worksheet mathematics and social quality
on:
  pull_request:
    paths:
      - 'worksheet-math-lesson-depth.js'
      - 'worksheet-math-coverage.js'
      - 'worksheet-math-grade3-concepts.js'
      - 'worksheet-math-grade4-geometry.js'
      - 'worksheet-math-grade2-numbers-time.js'
      - 'worksheet-math-grade2-data-patterns.js'
      - 'worksheet-math-grade2-length.js'
      - 'worksheet-math-grade1-number-sense.js'
      - 'worksheet-math-grade1-shapes-patterns.js'
      - 'worksheet-math-grade3-fraction-graphs.js'
      - 'tests/worksheet-math-grade3-fraction-graphs.test.cjs'
      - 'tests/worksheet-math-grade1-concepts.test.cjs'
      - 'tests/worksheet-math-grade2-data-length.test.cjs'
      - 'tests/worksheet-math-grade2-numbers-time.test.cjs'
      - 'tests/worksheet-math-grade34-concepts.test.cjs'
      - 'tests/worksheet-math-coverage.test.cjs'
      - 'worksheet-social-source-depth.js'
      - 'worksheet-evidence-banks.js'
      - '문제지 만들기.html'
      - 'tests/worksheet-math-social-depth.test.cjs'
      - 'tests/worksheet-evidence-banks.test.cjs'
      - 'tests/worksheet-social-audit.test.cjs'
      - 'docs/social-lesson-coverage.csv'
  push:
    branches:
      - main
    paths:
      - 'worksheet-math-lesson-depth.js'
      - 'worksheet-social-source-depth.js'
      - 'worksheet-evidence-banks.js'
      - 'tests/worksheet-math-social-depth.test.cjs'
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and focused regression tests
        run: |
          node --check worksheet-math-lesson-depth.js
          node --check worksheet-math-coverage.js
          node --check worksheet-math-grade3-concepts.js
          node --check worksheet-math-grade4-geometry.js
          node --check worksheet-math-grade2-numbers-time.js
          node --check worksheet-math-grade2-data-patterns.js
          node --check worksheet-math-grade2-length.js
          node --check worksheet-math-grade1-number-sense.js
          node --check worksheet-math-grade1-shapes-patterns.js
          node --check worksheet-math-grade3-fraction-graphs.js
          node --check worksheet-social-source-depth.js
          node --check worksheet-evidence-banks.js
          node --test tests/worksheet-math-grade3-fraction-graphs.test.cjs tests/worksheet-math-grade1-concepts.test.cjs tests/worksheet-math-grade2-data-length.test.cjs tests/worksheet-math-grade2-numbers-time.test.cjs tests/worksheet-math-grade34-concepts.test.cjs tests/worksheet-math-coverage.test.cjs tests/worksheet-math-social-depth.test.cjs tests/worksheet-evidence-banks.test.cjs tests/worksheet-social-audit.test.cjs tests/worksheet-learning.test.cjs
      - name: Check social lesson capacity CSV stays reproducible
        run: |
          node scripts/social-lesson-coverage.cjs
          git diff --exit-code -- docs/social-lesson-coverage.csv
