      - 'worksheet-learning*.js'
      - 'worksheet-speaking*.js'
      - 'worksheet-speaking.css'
      - 'workspace-home*.js'
      - 'workspace-home*.css'
      - 'index.html'
      - 'gulliver-app-shell.js'
      - 'tests/clasheet-home.test.cjs'
      - '말하기.html'
      - 'tests/worksheet-speaking*.cjs'
      - 'worksheet-korean-depth.js'
