      - 'tests/worksheet-learning-mix*.cjs'
      - 'tests/worksheet-social-audit.test.cjs'
      - 'worksheet-evidence-banks.js'
      - 'tests/worksheet-science-term2.test.cjs'
      - 'tests/worksheet-science-term1.test.cjs'
      - 'tests/worksheet-science-other-grades.test.cjs'
      - 'tests/worksheet-science-second-semester.test.cjs'
      - 'tests/worksheet-evidence-banks.test.cjs'
      - 'daily-worksheet.css'
      - '문제지 만들기.html'
      - '받아쓰기.html'
      - 'worksheet-dictation*'
      - 'worksheet-english-dictation.js'
      - 'tests/worksheet-english-dictation*'
      - 'tests/worksheet-dictation*'
      - 'data-standards.js'
      - 'tests/daily-worksheet-*'
      - 'tests/worksheet-pr-contract.test.cjs'
      - 'tests/worksheet-balanced-pages.test.cjs'
      - 'tests/worksheet-pdf-review.cjs'
      - 'scripts/worksheet-pr-contract.cjs'
      - 'scripts/worksheet-critique-loop.cjs'
      - 'tests/worksheet-critique-loop.test.cjs'
      - 'tests/worksheet-critique-revisions.test.cjs'
      - 'tests/worksheet-five-more-rounds.test.cjs'
      - 'tests/worksheet-critique-rounds-11-15.test.cjs'
      - 'column-math.js'
      - 'docs/worksheet-critique-loop.md'
      - 'docs/worksheet-2022-alignment.md'
      - 'docs/worksheet-quality-process.md'
      - '.github/PULL_REQUEST_TEMPLATE/worksheet-quality.md'
      - '.github/workflows/worksheet-quality-gate.yml'
  push:
    branches: [main]
    paths:
      - 'daily-worksheet-*.js'
      - 'science-*.js'
      - 'worksheet-science-term2.js'
      - 'worksheet-science-term1.js'
      - 'worksheet-science-other-grades.js'
      - 'worksheet-science-second-semester.js'
      - 'worksheet-science-depth.js'
      - 'tests/worksheet-science-depth*.cjs'
      - 'worksheet-hanja*.js'
      - 'worksheet-hanja.css'
      - 'assets/fonts/hanja-tracing.woff'
      - 'tests/worksheet-hanja*.cjs'
      - 'worksheet-learning*.js'
      - 'worksheet-speaking*.js'
      - 'worksheet-speaking.css'
      - 'workspace-home*.js'
      - 'workspace-home*.css'
      - 'index.html'
      - 'gulliver-app-shell.js'
      - 'tests/clasheet-home.test.cjs'
      - '말하기.html'
      - 'tests/worksheet-speaking*.cjs'
      - 'worksheet-korean-depth.js'
      - 'worksheet-korean-readings.js'
      - 'tests/worksheet-korean-*.cjs'
      - 'worksheet-range-tree.js'
      - 'worksheet-social-modern-volume.js'
      - 'worksheet-social-local-life-depth.js'
      - 'worksheet-social-past-local-depth.js'
      - 'tests/worksheet-social-past-local*.cjs'
      - 'tests/worksheet-social-local-life*.cjs'
      - 'data/history-modern-depth.js'
      - 'tests/worksheet-history-modern*.cjs'
      - 'tests/worksheet-social-modern*.cjs'
      - 'worksheet-practice-ui.js'
      - 'tests/worksheet-practice*.cjs'
      - 'tests/worksheet-range-tree*.cjs'
      - 'tests/worksheet-learning-mix*.cjs'
      - 'tests/worksheet-social-audit.test.cjs'
      - 'worksheet-evidence-banks.js'
      - 'tests/worksheet-science-term2.test.cjs'
      - 'tests/worksheet-science-term1.test.cjs'
      - 'tests/worksheet-science-other-grades.test.cjs'
      - 'tests/worksheet-science-second-semester.test.cjs'
      - 'tests/worksheet-evidence-banks.test.cjs'
      - 'daily-worksheet.css'
      - '문제지 만들기.html'
      - '받아쓰기.html'
      - 'worksheet-dictation*'
      - 'worksheet-english-dictation.js'
      - 'tests/worksheet-english-dictation*'
      - 'tests/worksheet-dictation*'
      - 'data-standards.js'
      - 'tests/daily-worksheet-*'
      - 'tests/worksheet-pr-contract.test.cjs'
      - 'tests/worksheet-balanced-pages.test.cjs'
      - 'tests/worksheet-pdf-review.cjs'
      - 'scripts/worksheet-pr-contract.cjs'
      - 'scripts/worksheet-critique-loop.cjs'
      - 'tests/worksheet-critique-loop.test.cjs'
      - 'tests/worksheet-critique-revisions.test.cjs'
      - 'tests/worksheet-five-more-rounds.test.cjs'
      - 'tests/worksheet-critique-rounds-11-15.test.cjs'
      - 'column-math.js'
      - 'docs/worksheet-critique-loop.md'
      - 'docs/worksheet-2022-alignment.md'
      - 'docs/worksheet-quality-process.md'
      - '.github/workflows/worksheet-quality-gate.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  spec-handoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require stated scope, acceptance criteria, challenger and orchestrator decisions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/worksheet-pr-contract.cjs

  build-and-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check worksheet and verification syntax
        run: |
          node --check worksheet-dictation-custom.js
          node --check worksheet-speaking.js
          node --check worksheet-speaking-ui.js
          node --check worksheet-social-modern-volume.js
          node --check worksheet-social-local-life-depth.js
          node --check worksheet-social-past-local-depth.js
          node --check data/history-modern-depth.js
          node --check worksheet-hanja-levels.js
          node --check worksheet-hanja.js
          node --check worksheet-hanja-ui.js
          node --check science-inquiry.js
          node --check worksheet-science-term2.js
          node --check worksheet-science-term1.js
          node --check worksheet-science-other-grades.js
          node --check worksheet-science-second-semester.js
          node --check worksheet-science-depth.js
          node --check worksheet-korean-depth.js
          node --check worksheet-korean-readings.js
          node --check tests/worksheet-science-term2.test.cjs
          node --check science-materials.js
          node --check daily-worksheet-core.js
          node --check daily-worksheet.js
          node --check tests/daily-worksheet-formats.test.cjs
          node --check daily-worksheet-pagination.js
          node --check tests/daily-worksheet-a4.test.cjs
          node --check scripts/worksheet-pr-contract.cjs
          node --check tests/daily-worksheet-challenger.test.cjs
          node --check tests/worksheet-pr-contract.test.cjs
          node --check tests/daily-worksheet-browser.e2e.cjs
      - name: Run existing regressions and independent seeded challenger
        run: node --test tests/worksheet-hanja.test.cjs tests/worksheet-balanced-pages.test.cjs tests/daily-worksheet-core.test.cjs tests/daily-worksheet-challenger.test.cjs tests/worksheet-pr-contract.test.cjs tests/worksheet-dictation.test.cjs tests/worksheet-speaking.test.cjs tests/worksheet-speaking-recognition.test.cjs tests/worksheet-dictation-batchim.test.cjs tests/worksheet-dictation-levels.test.cjs tests/worksheet-dictation-custom.test.cjs tests/worksheet-english-dictation.test.cjs
      - name: Verify textbook science lesson coverage and unique evidence
        run: |
          node --test tests/worksheet-science-term2.test.cjs tests/worksheet-science-term1.test.cjs tests/worksheet-science-other-grades.test.cjs tests/worksheet-science-second-semester.test.cjs tests/worksheet-science-depth.test.cjs tests/worksheet-korean-depth.test.cjs tests/worksheet-korean-readings.test.cjs tests/worksheet-evidence-banks.test.cjs tests/worksheet-learning.test.cjs tests/worksheet-learning-mix.test.cjs tests/worksheet-social-audit.test.cjs tests/worksheet-social-modern.test.cjs tests/worksheet-history-modern-depth.test.cjs tests/worksheet-social-local-life-depth.test.cjs tests/worksheet-social-past-local-depth.test.cjs tests/worksheet-range-tree.test.cjs tests/worksheet-practice-ui.test.cjs
          node scripts/science-lesson-coverage.cjs
      - name: Collect structured critique candidates across subjects
        run: |
          node --check scripts/worksheet-critique-loop.cjs
          node --check tests/worksheet-five-more-rounds.test.cjs
          node --check tests/worksheet-critique-rounds-11-15.test.cjs
          node --check column-math.js
          node --test tests/worksheet-critique-loop.test.cjs tests/worksheet-critique-revisions.test.cjs tests/worksheet-five-more-rounds.test.cjs tests/worksheet-critique-rounds-11-15.test.cjs
          node scripts/worksheet-critique-loop.cjs --full
      - name: Attach pedagogical critique evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worksheet-critique-review
          path: test-artifacts/worksheet-critique
          if-no-files-found: ignore
          retention-days: 7

  classroom-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Korean fonts for readable and representative PDF output
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          fc-match 'sans:lang=ko'
      - name: Install pinned Playwright browser driver (use runner's Chrome)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1 jsdom@26.1.0
      - name: Prove complete A4 pages across five subjects, student/teacher versions and big print
        run: node --test --test-concurrency=1 tests/daily-worksheet-browser.e2e.cjs tests/daily-worksheet-a4.test.cjs tests/daily-worksheet-formats.test.cjs tests/worksheet-hanja-browser.test.cjs tests/clasheet-home.test.cjs tests/worksheet-speaking-browser.test.cjs tests/worksheet-dictation-browser.test.cjs tests/worksheet-dictation-custom-browser.test.cjs tests/worksheet-dictation-custom.test.cjs tests/worksheet-dictation-dom.test.cjs tests/worksheet-learning-mix-browser.test.cjs tests/worksheet-range-tree-browser.test.cjs tests/worksheet-social-modern-browser.test.cjs tests/worksheet-social-local-life-browser.test.cjs tests/worksheet-social-past-local-browser.test.cjs tests/worksheet-history-modern-browser.test.cjs tests/worksheet-science-depth-browser.test.cjs tests/worksheet-korean-depth-browser.test.cjs tests/worksheet-practice-browser.test.cjs tests/worksheet-learning-mix.test.cjs tests/worksheet-social-audit.test.cjs tests/worksheet-social-modern.test.cjs tests/worksheet-history-modern-depth.test.cjs tests/worksheet-social-local-life-depth.test.cjs tests/worksheet-social-past-local-depth.test.cjs tests/worksheet-range-tree.test.cjs tests/worksheet-practice-ui.test.cjs
      - name: Export all subject student and teacher PDFs for visual review
        run: node tests/worksheet-pdf-review.cjs
      - name: Attach screenshots and printable PDFs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worksheet-classroom-proof
          path: test-artifacts/worksheet-*
          if-no-files-found: ignore
          retention-days: 7

