name: Install 발표 뚝딱 libraries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-balpyo-ttak.yml'
      - 'scripts/install-balpyo-ttak.sh'
  workflow_dispatch:

concurrency:
  group: gulliver-balpyo-vendor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  install:
    if: github.repository == 'binyoun-cberi/ProjectGulliver'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Gulliver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Install official DeckCraft and PowerPoint export library
        shell: bash
        run: bash scripts/install-balpyo-ttak.sh

      - name: Validate static bundle before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/artcraft/deckcraft/index.html
          test -s assets/artcraft/deckcraft/licenses/LICENSE-MIT
          test -s assets/artcraft/deckcraft/licenses/LICENSE-APACHE
          test -s assets/artcraft/deckcraft/licenses/NOTICE
          test -s assets/artcraft/deckcraft/licenses/ATTRIBUTION.md
          test -s vendor/pptxgenjs/pptxgen.bundle.js
          test -s vendor/pptxgenjs/LICENSE
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('assets/artcraft/deckcraft')
          x=json.loads((d/'gulliver-install.json').read_text())
          assert x['source']=='storytold/deckcraft' and x['version']=='0.6.1'
          assert x['release_sha256']=='dd76659f643fa98ff79c86bf439bcaeeaaf6bd3a4037a1dc6628c97366862ba1'
          assert len(list(d.glob('deckcraft-web-*.js')))==1
          assert len(list(d.glob('deckcraft-web-*_bg.wasm')))==1
          h=Path('vendor/pptxgenjs')
          meta=json.loads((h/'version.json').read_text())
          assert meta['version']=='3.12.0'
          assert meta['file_git_blob_sha1']=='1ff971b3a9684bf3d2592883f1832e6992043154'
          assert (h/'pptxgen.bundle.js').stat().st_size>200_000
          assert all(p.stat().st_size<94_371_840 for folder in (d,h) for p in folder.rglob('*') if p.is_file())
          print('DeckCraft WASM and PptxGenJS browser bundle checked')
          PY

      - name: Commit only new presentation assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- assets/artcraft/deckcraft/ vendor/pptxgenjs/
          if git diff --cached --quiet; then
            echo "Assets are already current"
            exit 0
          fi
          git commit -m "chore(presentation): vendor DeckCraft v0.6.1 and PptxGenJS 3.12.0"
          git pull --rebase origin main
          git push origin HEAD:main
