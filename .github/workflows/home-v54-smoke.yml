name: Home 5.4 responsive checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'workspace-home.js'
      - 'workspace-experience.css'
      - 'workspace-home-v54.css'
      - 'tests/clasheet-first-start.test.cjs'
      - '.github/workflows/home-v54-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-home:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check current homepage and current tests
        run: |
          node --check workspace-home.js
          node --check tests/clasheet-first-start.test.cjs
      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Verify first-use, activities, and mobile home in Chrome
        run: node --test tests/clasheet-branding.test.cjs tests/classroom-workspace.test.cjs tests/clasheet-first-start.test.cjs
