<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3ff">
<title>음악 뚝딱 | 뚝딱교실</title><style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2c3150;background:#f7f7fc}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
header.top{padding:15px 22px;background:#fff;border-bottom:1px solid #e2e5f0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0}h2{font-size:17px}h3{font-size:14px}p{line-height:1.65;color:#66748a}
button{border:1px solid #d7d6e8;border-radius:10px;background:#fff;padding:9px 12px;min-height:38px;color:#4a4577;font-weight:720;font-size:12px}
button.primary{background:#7052cd;color:white;border-color:#7052cd}
.workspace{display:grid;grid-template-columns:245px minmax(0,1fr);gap:15px;max-width:1350px;margin:17px auto;padding:0 15px}
.panel,.editor{background:#fff;border:1px solid #e2e5ee;border-radius:16px;padding:18px;min-width:0}
label{display:grid;gap:6px;font-weight:750;font-size:12px;margin-bottom:13px}
label input{border:1px solid #d4dbea;border-radius:9px;padding:10px;width:100%;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:7px}
.templates{display:grid;gap:7px;margin-top:12px}
.templates button{text-align:left}
.beat-grid{display:grid;grid-template-columns:88px repeat(16,minmax(19px,1fr));gap:4px;overflow-x:auto;min-width:640px;margin-top:16px}
.track-label{font-weight:760;font-size:12px;align-self:center;color:#4b566f}
.beat-button{min-width:19px;height:35px;border:1px solid #d7dcef;border-radius:6px;background:#edf0f8;padding:0;position:relative}
.beat-button[aria-pressed=true]{background:#8061df;border-color:#7051ca;box-shadow:inset 0 0 0 3px #bca8ff}
.beat-button:nth-child(4n+2){border-left:2px solid #8e94ac}
.beat-head{font-size:10px;text-align:center;color:#8b93a5}
.grid-scroll{overflow-x:auto;padding:5px 1px}
.preview{height:62px;border-radius:12px;background:#f1edff;padding:12px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.preview audio{max-width:100%;width:360px}
.help{margin-top:16px;padding:12px;background:#f7f8fc;border-radius:12px;font-size:12px}
#msg{font-size:12px;color:#2d7b57;min-height:20px}
@media(max-width:780px){.workspace{display:flex;flex-direction:column;padding:9px;gap:9px;margin:0}.panel,.editor{padding:14px}.beat-grid{grid-template-columns:76px repeat(16,26px);min-width:590px}}
</style></head><body>
<header class="top"><div><h1>음악 뚝딱</h1><p style="font-size:12px;margin:5px 0 0">박자를 누르고 멜로디를 만들어요. 파일을 업로드하지 않아도 돼요.</p></div><div class="actions"><button id="playMusic" class="primary">▶ 들어보기</button><button id="stopMusic">■ 멈춤</button><button id="exportWav" class="primary">WAV 저장</button></div></header>
<main class="workspace">
<aside class="panel">
<h2>음악 설정</h2>
<label for="titleInput">음악 이름<input id="titleInput" maxlength="90"></label>
<label for="bpmInput">빠르기 (BPM 60~180)<input id="bpmInput" type="number" min="60" max="180" step="1"></label>
<label for="loopsInput">반복 마디 (1~8)<input id="loopsInput" type="number" min="1" max="8"></label>
<label for="melodyPitch">멜로디 음높이 (48~84)<input id="melodyPitch" type="number" min="48" max="84"></label>
<h3>바로 시작할 음악</h3><div class="templates" id="templates"><button data-template="welcome">환영 인사</button><button data-template="dance">신나는 놀이</button><button data-template="calm">조용한 정리</button></div>
</aside>
<section class="editor">
<h2>16칸 리듬·멜로디 제작판</h2>
<p style="font-size:13px">보라색 칸은 소리가 나는 박자야. 칸을 눌러 켜거나 끄고, 빠르기와 반복 횟수를 바꿔 봐.</p>
<div class="grid-scroll"><div id="beatGrid" class="beat-grid" aria-label="음악 박자 편집"></div></div>
<div class="preview"><strong style="font-size:12px">들어보기</strong><audio id="audioPreview" controls aria-label="미리 듣기"></audio></div>
<div class="help">멜로디와 베이스, 손뼉, 작은 심벌즈를 조합할 수 있어. WAV 파일은 다른 발표·영상 프로그램에서도 쓸 수 있는 일반 오디오 파일이야. 아직 MP3 변환과 녹음·실제 악기 샘플 편집은 지원하지 않아.</div>
<p id="msg" role="status" aria-live="polite"></p>
</section></main>
<script src="studio-media-core.js"></script><script src="music-core.js"></script><script src="music-ttak.js"></script></body></html>
